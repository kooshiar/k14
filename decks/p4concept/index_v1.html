<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Scoring Page Concepts · K14</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--ink:#14161A;--mut:#596070;--line:#E6E8EC;--g:#2E8A1F;--red:#B3261E;--bg:#E9E6DF}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font-family:Geist,ui-sans-serif,system-ui,sans-serif;color:var(--ink)}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.slide{flex:none;width:1600px;height:900px;background:#fff;border-radius:18px;transform-origin:center;position:relative;overflow:hidden}
.lb{font:500 17px "Geist Mono",monospace;color:var(--mut)}.sb{font-size:21px;color:var(--mut);margin-top:6px}
.n{font:600 52px/1.05 Geist,sans-serif;letter-spacing:-.01em}
.hero{font:600 104px/1 Geist,sans-serif;letter-spacing:-.025em}
h1{margin:0;font:600 46px/1.15 Geist,sans-serif;letter-spacing:-.01em}
.bot{width:26px;height:56px;border-radius:7px 7px 4px 4px;background:#D9DDE3;position:relative}.bot:before{content:'';position:absolute;left:9px;top:-12px;width:8px;height:14px;border-radius:2px;background:inherit}
.bot.t{background:var(--red)}
</style></head><body><div class="stage"><div class="slide" id="s"></div></div>
<script>
const L=(hero,title,right,col)=>`<div style="display:grid;grid-template-columns:1.15fr 1fr;height:100%">
 <div style="padding:0 72px 0 96px;display:flex;flex-direction:column;justify-content:center">${hero?`<div class="hero" style="color:${col||'var(--ink)'}">${hero}</div>`:''}<h1 style="margin-top:${hero?22:0}px;${hero?'':'font-size:56px'}">${title}</h1></div>
 <div style="background:#F7F6F2;padding:0 80px;display:flex;flex-direction:column;justify-content:center;gap:40px">${right}</div></div>`;
const fact=(l,n,s,sz)=>`<div><div class="lb">${l}</div><div class="n" style="margin-top:8px;${sz?'font-size:'+sz+'px':''}">${n}</div>${s?`<div class="sb">${s}</div>`:''}</div>`;
const G=[['Performance',40,['Removes cork taint (TCA)','Keeps fruit and floral aroma','Leaves nothing in the wine','Holds more per kg']],['Safety & rules',30,['Food-safe','Allowed for sale']],['Cost',15,['Cost per bottle','Equipment cost']],['Fit & supply',15,["Drops into today's setup",'Easy to ship and store','Easy to make']]];
const GC=['#2E8A1F','#14161A','#5A6270','#9AA1AD'];
const fin=`function fit(){const w=document.documentElement.clientWidth||innerWidth,h=document.documentElement.clientHeight||innerHeight;if(!w||!h)return;const s=Math.min(w/1640,h/940);document.getElementById('s').style.transform='scale('+s+')'}addEventListener('resize',fit);new ResizeObserver(()=>fit()).observe(document.documentElement);addEventListener('load',fit);[50,300,1000].forEach(t=>setTimeout(fit,t));fit();`;
const CK=[['Binds TCA','in water'],['Picks TCA over fruit ester','at 10× more'],['Picks TCA over rose alcohol','at 100× more'],['Picks TCA over vanillin','at 10× more'],['No toxic groups','13 alerts'],['Stays out of the wine','logP ~3+'],['Stays bound','in water MD'],['Cost per use','size + steps']];
const V={
1(){return L('11','checks simulated per design',`<ol style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px">${CK.map(([a,b],i)=>`<li style="display:grid;grid-template-columns:34px 1fr auto;align-items:baseline;font:500 23px Geist"><span class="lb">${i+1}</span><span>${a}</span><span class="sb" style="margin:0;font-size:18px">${b}</span></li>`).join('')}</ol>`)},
2(){const g=[['Performance',CK.slice(0,4).concat([CK[6]])],['Safety & rules',[CK[4],CK[5]]],['Cost',[CK[7]]]];return L('11','checks simulated per design',g.map(([n,c],i)=>`<div><div style="font:600 25px Geist;display:flex;align-items:center;gap:10px"><i style="width:12px;height:12px;border-radius:3px;background:${GC[i]}"></i>${n}</div><div class="sb" style="line-height:1.5;margin-top:6px">${c.map(x=>x[0]).join(' · ')}</div></div>`).join(''))},
3(){return L('4','of the checks test TCA against the wine’s own aromas',CK.slice(0,4).map(([a,b],i)=>`<div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #E6E8EC;padding-bottom:12px"><span style="font:500 24px Geist">${a}</span><span class="sb" style="margin:0">${b}</span></div>`).join(''),'var(--g)')},
4(){const box=(t,s,c)=>`<div style="background:${c||'#fff'};color:${c?'#fff':'var(--ink)'};border-radius:12px;padding:22px 26px"><div style="font:600 30px Geist">${t}</div><div style="font-size:18px;margin-top:6px;opacity:.8">${s}</div></div>`;
 return L('11','checks simulated per design',box('1 design','from 433 made')+`<div style="text-align:center;font:600 28px Geist;color:var(--mut);margin:-20px 0">↓</div>`+box('11 checks','binding · selectivity · safety · cost')+`<div style="text-align:center;font:600 28px Geist;color:var(--mut);margin:-20px 0">↓</div>`+box('1 score, 0–100','50 = best sold today','#14161A'))},
5(){return L('40%','of the score comes from 5 performance checks',G.map(([g,w],i)=>`<div style="display:grid;grid-template-columns:200px 1fr 60px;align-items:center;gap:16px"><span style="font:600 23px Geist">${g}</span><div style="height:14px;background:#E6E8EC;border-radius:7px"><div style="width:${w*2.5}%;height:100%;background:${GC[i]};border-radius:7px"></div></div><span class="mono" style="font-size:20px;color:var(--mut);text-align:right">${w}%</span></div>`).join(''))}};
const v=+(new URLSearchParams(location.search).get('v')||1);
Promise.resolve(typeof PRE==='function'?PRE():null).then(()=>{document.getElementById('s').innerHTML=(V[v]||V[1])();eval(fin)});
</script></body></html>

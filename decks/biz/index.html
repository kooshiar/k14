 ['Value',x=>{const v=x.value||{};return [['Value created',`<span class="big">${money(v.created_usd_yr)}</span> /yr`],['Logic',v.logic],['Our revenue',money(v.our_revenue_usd_yr)+' /yr at maturity'],['Revenue logic',v.revenue_logic],['Gross margin',(v.gross_margin_pct??'—')+'%'],['Margin logic',v.margin_logic],['Sources',src(v.sources)]]}],
 ['Growth',x=>{const t=x.trend||{};return [['Growth',`<span class="big">${t.cagr_pct??'—'}%</span> /yr`],['Drivers',t.drivers],['Deadline',t.deadline||'—'],['Sources',src(t.sources)]]}],
 ['Rivals',x=>{const c=x.competition||{};const l=a=>(a||[]).join(', ')||'—';return [['Direct startups',`${(c.direct_startups||[]).length} · ${esc(l(c.direct_startups))}`],['Indirect startups',`${(c.indirect_startups||[]).length} · ${esc(l(c.indirect_startups))}`],['Incumbents',esc(l(c.incumbents))],['Papers 2023–25',`${x.raw.papers} · Semantic Scholar`],['Active researchers',`${x.raw.groups} with 3+ papers`],['Notes',c.notes],['Sources',src(c.sources)]]}],
 ['Lab',x=>{const b=x.lab||{};return [['First lab proof',`<span class="big">${b.weeks??'—'} wk</span> · ${money(b.usd)}`],['Synthesis',b.synth],['Test',b.test],['Logic',b.logic],['Sources',src(b.sources)]]}],
 ['Sale',x=>{const s=x.sale||{};return [['To first sale',`<span class="big">${s.years_to_first_sale??'—'} yr</span>`],['Gates',s.gates],['Fit',`complexity ${x.cx.join(' · ')} (needs · formulation · properties · environment · atoms)`],['Sources',src(s.sources)]]}]];
let CUR=null;
function det(k){CUR=D.rows.find(r=>r.k===k);$('dt').textContent=CUR.n;$('dtabs').innerHTML=TABS.map(([l],i)=>`<button type="button" data-i="${i}">${l}</button>`).join('');
 [...$('dtabs').children].forEach(b=>b.onclick=()=>tab(+b.dataset.i));tab(0);$('dlg').showModal()}
function tab(i){[...$('dtabs').children].forEach((b,j)=>b.classList.toggle('on',i===j));
 $('dbody').innerHTML='<dl class="kv">'+TABS[i][1](CUR).map(([a,b])=>`<dt>${a}</dt><dd>${b&&String(b).includes('<')?b:esc(b??'—')}</dd>`).join('')+'</dl>'}
$('dx').onclick=()=>$('dlg').close();$('dlg').onclick=e=>{if(e.target===$('dlg'))$('dlg').close()};
$('pk').innerHTML=[['type','Type'],...PIL.map(([p,[l]])=>[p,l]),...RAWC.map(([p,l])=>['r_'+p,l])].map(([k,l])=>`<label><input type="checkbox" data-c="${k}"${COLS[k]?' checked':''}>${l}</label>`).join('');
[...$('pk').querySelectorAll('input')].forEach(c=>c.onchange=()=>{COLS[c.dataset.c]=c.checked?1:0;try{localStorage.setItem('biz-cols',JSON.stringify(COLS))}catch(e){}draw()});
$('cb').onclick=e=>{e.stopPropagation();$('cols').classList.toggle('on')};document.addEventListener('click',e=>{if(!$('cols').contains(e.target))$('cols').classList.remove('on')});
['q','fT','fG'].forEach(i=>$(i).oninput=()=>{PI=0;draw()});draw();
</script></body></html>

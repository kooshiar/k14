<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Refinyx · Route Options · K14</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style id="v3css">
/* spinoff deck v3, investor-deck look (2026-10-23): white slide, warm grey page, black pill, hairline grids */
:root{--page:#E6E3DC;--ink:#0B0D12;--body:#2A2F3A;--mut:#596070;--line:#C6CCD5;--green:#2E8A1F;--tag:#E6E9EE;--tagc:#1F2430;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;--navbg:#fff;--navtx:#3A3F4A}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--page);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
.stage{height:100%;display:grid;place-items:center;padding:16px}
.slide{display:none;width:min(100%,calc((100vh - 32px)*16/9));aspect-ratio:16/9;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 12px 40px rgba(0,0,0,.08);
  container-type:inline-size;padding:4.6cqw 6% 4cqw;flex-direction:column;gap:3cqw;overflow:hidden}
.slide.on{display:flex}
.hd{display:flex;flex-direction:column;align-items:flex-start;gap:1.6cqw}
.pl{font:500 .95cqw/1 var(--mono);background:#181818;color:#fff;border-radius:99px;padding:.5cqw .9cqw}
h2{margin:0;font:500 3.2cqw/1.08 var(--sans);letter-spacing:-.035em;color:var(--ink);max-width:80cqw}
h2 .n{color:var(--green)}
.vis{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;padding-top:1.4cqw}
/* tiles: hairline grid */
.tl{display:grid;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.tl>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:2.8cqw 2.6cqw 3cqw;display:flex;flex-direction:column;gap:1.1cqw}
.tl .lb{font:500 1.35cqw/1.2 var(--mono);color:var(--mut)}
.tl .big{font:600 4.6cqw/1 var(--sans);letter-spacing:-.04em;color:var(--ink)}.tl .big.a{color:var(--green)}
.tl .sb{font:400 1.7cqw/1.3 var(--sans);color:var(--body)}
/* needs: 4 groups */
.nd{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.nd>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:2.4cqw 2.4cqw 2.8cqw;display:flex;flex-direction:column;gap:1.6cqw}
.nd h4{margin:0;font:600 2cqw/1.1 var(--sans);letter-spacing:-.02em}
.nd ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1cqw}
.nd li{font:400 1.6cqw/1.3 var(--sans);color:var(--body)}
/* scoring: sim checks left, weight bars right */
.sc{display:grid;grid-template-columns:1fr 1.3fr;gap:4cqw;align-items:start}
.sc ol{margin:0;padding:0;list-style:none;counter-reset:c;display:flex;flex-direction:column;gap:.7cqw}
.sc ol li{counter-increment:c;display:grid;grid-template-columns:2.2cqw 1fr;font:400 1.3cqw/1.3 var(--sans);color:var(--body)}
.sc ol li::before{content:counter(c);font:500 1.1cqw/1.3 var(--mono);color:var(--mut)}
.sc .lh{font:500 1.1cqw/1 var(--mono);color:var(--mut);margin-bottom:1.2cqw}
.wb{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.wb .bx{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:1.4cqw 1.6cqw;display:flex;flex-direction:column;gap:.55cqw}
.wb .bn{display:flex;justify-content:space-between;align-items:baseline;font:600 1.45cqw/1.1 var(--sans);margin-bottom:.4cqw}.wb .bn b{font:600 2.4cqw/1 var(--sans);letter-spacing:-.03em;color:var(--green)}
.wb .rw{display:flex;justify-content:space-between;gap:1cqw;font:400 1.15cqw/1.25 var(--sans);color:var(--body)}.wb .rw em{font:500 1.05cqw/1.25 var(--mono);font-style:normal;color:var(--mut)}
/* designs: 6 x 2 molecules */
/* the grid fills the free height of the slide (taller tiles); each molecule is fitted to its tile in draw() */
.mg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.mg>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:relative;min-height:0}
.mg canvas{position:absolute;left:.6cqw;top:.6cqw;width:calc(100% - 1.2cqw);height:calc(100% - 1.2cqw);cursor:grab;touch-action:none}
/* numbers per design, one column top left: heavy/total atoms, box size (A), atoms other than C and H; the molecule is fitted around them */
.mg .mn{position:absolute;left:.8cqw;top:.7cqw;pointer-events:none;font:500 1cqw/1 var(--mono);color:var(--mut)}.mg div:first-child .mn{color:var(--green)}
.mg .ms{position:absolute;right:.8cqw;top:.7cqw;margin:0;display:flex;flex-direction:column;align-items:flex-end;gap:.35cqw;pointer-events:none;font:500 .95cqw/1 var(--mono);color:var(--mut)}
.mg .ms i{font-style:normal}
.mg .at{position:absolute;display:none;pointer-events:none;transform:translate(-50%,-135%);padding:.25cqw .5cqw;border-radius:4px;background:#181818;color:#fff;font:500 .95cqw/1 var(--mono);white-space:nowrap;z-index:2}
/* results table */
.rt{border-collapse:collapse;font:400 1cqw/1.15 var(--sans);color:var(--body);align-self:flex-start}
.rt th{font:500 1cqw/1.2 var(--mono);color:var(--ink);text-align:right;padding:0 0 .6cqw 2.6cqw;border-bottom:1px solid #181818;vertical-align:bottom;white-space:nowrap}
.rt th:first-child{text-align:left;padding-left:0}.rt th small{display:block;font:400 .9cqw/1.2 var(--mono);color:var(--mut);margin-top:.25cqw}
.rt td{padding:.26cqw 0 .26cqw 2.6cqw;text-align:right;font-family:var(--mono);font-size:1cqw;border-bottom:1px solid #EDEFF2;white-space:nowrap}
.rt td:first-child{text-align:left;padding-left:0;font-family:var(--sans);font-size:1.05cqw}
.rt tr.ov td{font:600 1.45cqw/1.1 var(--sans);color:var(--ink);padding-top:.55cqw;padding-bottom:.55cqw;border-bottom:1px solid var(--line)}
.rt tr.bx td{font-weight:600;color:var(--ink);padding-top:.6cqw}
.rt tr.bx td:first-child{font-weight:600}
.rt.dense td{padding-top:.16cqw;padding-bottom:.16cqw}.rt.dense tr.bx td{padding-top:.45cqw}.rt.xdense td{padding-top:.08cqw;padding-bottom:.08cqw;font-size:.92cqw}.rt.xdense td:first-child{font-size:.95cqw}.rt.xdense tr.ov td{font-size:1.3cqw;padding-top:.35cqw;padding-bottom:.35cqw}.rt td.us{color:var(--green)}.rt tr.ov td.us{color:var(--green)}
.rt td.lo{color:#C2410C}
/* next: make -> test -> pilot */
.nx{display:grid;grid-template-columns:1fr 2.2fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.nx>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:2.6cqw 2.4cqw 3cqw;display:flex;flex-direction:column;gap:1.4cqw}
.nx .k{font:500 1.25cqw/1 var(--mono);color:var(--mut)}
.nx h4{margin:0;font:600 2.4cqw/1.1 var(--sans);letter-spacing:-.025em}
.nx .big{font:600 4.6cqw/1 var(--sans);letter-spacing:-.04em;color:var(--green)}
.nx ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw 2.4cqw}
.nx li{display:flex;flex-direction:column;gap:.35cqw}.nx li b{font:600 1.6cqw/1.2 var(--sans);color:var(--ink)}.nx li span{font:400 1.35cqw/1.3 var(--sans);color:var(--body)}
.nx .sb{font:400 1.6cqw/1.3 var(--sans);color:var(--body)}
.nav{position:fixed;right:16px;bottom:16px;display:flex;gap:6px;align-items:center;background:#fff;border:1px solid #DDE1E7;border-radius:8px;padding:4px;font:500 12px/1 var(--mono)}
.nav button{width:30px;height:30px;border:0;border-radius:5px;background:#F3F4F6;cursor:pointer}
@media (max-width:700px){body{overflow:auto}.stage{display:block;padding:12px}.slide{display:flex!important;width:100%;aspect-ratio:auto;margin-bottom:12px;padding:22px 16px}
 h2{font-size:22px}.pl{font-size:11px;padding:5px 9px}.tl,.nd,.nx{grid-template-columns:1fr!important}.mg{flex:none;grid-template-rows:none}.mg>div{aspect-ratio:1/1}.mg canvas{left:4px;top:4px;width:calc(100% - 8px);height:calc(100% - 8px)}.mg .ms{font-size:9px;right:6px;top:6px;gap:3px}.mg .mn{font-size:10px;left:6px;top:6px}.mg .at{font-size:10px}.mg{grid-template-columns:repeat(3,1fr)}.sc{grid-template-columns:1fr}
 .tl .lb,.sc .lh,.nx .k,.mg span{font-size:11px}.tl .big,.nx .big{font-size:26px}.tl .sb,.nd li,.sc ol li,.wb .rw,.nx li span,.nx .sb{font-size:13px}.nd h4,.nx h4,.wb .bn,.nx li b{font-size:15px}
 .rt{font-size:11px}.rt td,.rt th,.rt td:first-child{font-size:11px}.rt tr.ov td{font-size:14px}.vis{overflow-x:auto}.nav{display:none}}
</style><style>.vis .rv{width:100%;height:100%;max-height:100%;display:block}@media (max-width:700px){.vis{overflow-x:auto}.vis .rv{min-width:900px;height:auto}}</style></head><body><div class="stage">

<script>const MOL=[];</script><script>
const S=[...document.querySelectorAll('.slide')];let cur=0;
function go(n){cur=Math.max(0,Math.min(S.length-1,n));S.forEach((s,i)=>s.classList.toggle('on',i===cur));
  document.getElementById('pg').textContent=`${cur+1} / ${S.length}`;prev.disabled=cur===0;next.disabled=cur===S.length-1;if(cur===4)drawAll();}
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
// molecules: heavy atoms, bonds by distance; turns only while dragged; hovering an atom names it
// one atom palette everywhere (Koosh 2026-10-24): same colours as the site's app tiles (site/appmols.js) and template_deck.html
const COL={C:'#1A1A1A',O:'#E10600',N:'#0057FF',F:'#00A651',S:'#FFC400',P:'#FF7A00',Cl:'#00A651',Li:'#8A2BE2',Zn:'#0057FF',Si:'#FF7A00',Al:'#FF7A00',Ir:'#0057FF',Zr:'#00A651',Y:'#FFC400',Fe:'#E10600',Ni:'#00A651',Ru:'#FF7A00',Pt:'#0057FF',I:'#8A2BE2',Au:'#FF7A00',Mg:'#FF7A00',Nd:'#8A2BE2',Pr:'#8A2BE2',B:'#FF7A00',La:'#8A2BE2',K:'#8A2BE2',Gd:'#8A2BE2',Cu:'#C8642A',Br:'#C8642A',Se:'#FFC400'};
const RAD={C:.5,O:.48,N:.48,S:.6,F:.45,Cl:.58,Br:.62,I:.68,P:.6,Si:.6,B:.5};
const NAME={C:'carbon',O:'oxygen',N:'nitrogen',S:'sulfur',F:'fluorine',Cl:'chlorine',Br:'bromine',I:'iodine',P:'phosphorus',Si:'silicon',B:'boron',Se:'selenium',Fe:'iron',Cu:'copper',Zn:'zinc',Na:'sodium',K:'potassium',Ca:'calcium',Mg:'magnesium',Al:'aluminium',Li:'lithium',Pt:'platinum',Pd:'palladium',Ni:'nickel',Co:'cobalt',Mn:'manganese',Ti:'titanium',Ru:'ruthenium',Au:'gold',Ag:'silver'};
const V=[...document.querySelectorAll('.mg canvas')].map((c,i)=>{const m=MOL[i];if(!m)return null;
  const n=m.els.length,cx=[0,1,2].map(k=>m.X.reduce((s,p)=>s+p[k],0)/n);const X=m.X.map(p=>p.map((v,k)=>v-cx[k]));
  const big=e=>!['C','N','O','F','B','H'].includes(e),bonds=[];
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){const d=Math.hypot(X[a][0]-X[b][0],X[a][1]-X[b][1],X[a][2]-X[b][2]);if(d<((big(m.els[a])||big(m.els[b]))?2.25:1.75))bonds.push([a,b])}
  const tile=c.parentElement,lab=tile.querySelector('.ms'),num=tile.querySelector('.mn'),tip=tile.querySelector('.at');
  const st={c,lab,num,tip,X,els:m.els,bonds,ar:m.els.map(e=>(RAD[e]||.6)*.55),th:.5+i*.7,ph:-.35,th0:.5+i*.7,ph0:-.35,drag:null,P:null,R:null};
  const hit=ev=>{if(!st.P)return -1;const r=c.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;let best=-1;   // front-most atom under the pointer
    st.P.forEach((p,k)=>{if(Math.hypot(p[0]-x,p[1]-y)<=Math.max(st.R[k],5)+1&&(best<0||p[2]>st.P[best][2]))best=k});return best};
  const show=ev=>{const k=hit(ev);if(k<0){tip.style.display='none';c.style.cursor='grab';return}
    const e=st.els[k],r=c.getBoundingClientRect(),tr=tile.getBoundingClientRect();tip.textContent=NAME[e]?`${e} · ${NAME[e]}`:e;
    tip.style.left=(r.left-tr.left+st.P[k][0])+'px';tip.style.top=(r.top-tr.top+st.P[k][1])+'px';tip.style.display='block';c.style.cursor='pointer'};
  c.onpointerleave=()=>{st.drag=null;tip.style.display='none'};
  c.onpointerdown=ev=>{st.drag=[ev.clientX,ev.clientY];c.setPointerCapture(ev.pointerId);tip.style.display='none'};c.onpointerup=()=>st.drag=null;
  c.onpointermove=ev=>{if(!st.drag){show(ev);return}st.th+=(ev.clientX-st.drag[0])*.01;st.ph+=(ev.clientY-st.drag[1])*.01;st.drag=[ev.clientX,ev.clientY];draw(st)};
  return st}).filter(Boolean);
// turn the molecule, then fit it into a region: box around every atom incl. its drawn radius, scaled with padding and centered
function view(st,th,ph,A){const ct=Math.cos(th),sn=Math.sin(th),cp=Math.cos(ph),sp=Math.sin(ph);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const Q=st.X.map(([x,y,z],i)=>{const xr=x*ct+z*sn,zr=-x*sn+z*ct,yr=-(y*cp-zr*sp),r=st.ar[i];x0=Math.min(x0,xr-r);x1=Math.max(x1,xr+r);y0=Math.min(y0,yr-r);y1=Math.max(y1,yr+r);return[xr,yr,y*sp+zr*cp]});
  const w=A[2]-A[0],h=A[3]-A[1],pad=Math.max(5,Math.min(w,h)*.07),sc=Math.max(.1,Math.min((w-2*pad)/Math.max(x1-x0,.1),(h-2*pad)/Math.max(y1-y0,.1),Math.min(w,h)/5));
  return{Q,sc,mx:(x0+x1)/2,my:(y0+y1)/2,cx:(A[0]+A[2])/2,cy:(A[1]+A[3])/2}}
// #n sits top left, the numbers top right: the molecule goes below both, or between them under #n, whichever lets it be drawn larger
function regions(st,W,H){const c=st.c.getBoundingClientRect(),l=st.lab.getBoundingClientRect(),n=st.num.getBoundingClientRect();
  const lx=l.left-c.left-4,lb=l.bottom-c.top+4,nb=n.bottom-c.top+4;
  return [[0,Math.max(0,lb,nb),W,H],[0,Math.max(0,nb),Math.min(W,lx),H]].filter(A=>A[2]-A[0]>20&&A[3]-A[1]>20)}
function draw(st){const c=st.c,ctx=c.getContext('2d'),d=devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;if(!W||!H)return;
  const bw=Math.round(W*d),bh=Math.round(H*d);if(c.width!==bw||c.height!==bh){c.width=bw;c.height=bh}ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,W,H);
  // size and region are set by the resting view; while turned it only shrinks when it would no longer fit, so it never leaves its region
  if(st.fw!==W||st.fh!==H){st.fw=W;st.fh=H;const R=regions(st,W,H);if(!R.length)R.push([0,0,W,H]);
    const vs=R.map(A=>view(st,st.th0,st.ph0,A).sc);const k=vs.indexOf(Math.max(...vs));st.A=R[k];st.sc0=vs[k]}
  const v=view(st,st.th,st.ph,st.A),sc=Math.min(st.sc0,v.sc),ox=v.cx-v.mx*sc,oy=v.cy-v.my*sc;
  const P=v.Q.map(([x,y,z])=>[ox+x*sc,oy+y*sc,z]);st.P=P;st.R=st.ar.map(r=>Math.max(1.6,r*sc));
  const it=st.bonds.map(b=>({z:(P[b[0]][2]+P[b[1]][2])/2-.2,b})).concat(st.els.map((e,i)=>({z:P[i][2],i})));it.sort((a,b)=>a.z-b.z);
  for(const o of it){if(o.b){const[a,b]=o.b;ctx.strokeStyle='#3A3F4A';ctx.lineWidth=Math.max(1,sc*.12);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(P[a][0],P[a][1]);ctx.lineTo(P[b][0],P[b][1]);ctx.stroke()}
    else{ctx.fillStyle=COL[st.els[o.i]]||'#7A3FFF';ctx.beginPath();ctx.arc(P[o.i][0],P[o.i][1],st.R[o.i],0,7);ctx.fill()}}}
function drawAll(){V.forEach(st=>{st.fw=0;draw(st)})}
// redraw whenever a canvas gets a new size: window resize, full screen, the phone layout (all pages shown), late fonts
if(window.ResizeObserver){const ro=new ResizeObserver(es=>es.forEach(en=>{const st=V.find(s=>s.c===en.target);if(st)draw(st)}));V.forEach(st=>ro.observe(st.c))}
addEventListener('resize',drawAll);addEventListener('load',drawAll);drawAll();
go(0);

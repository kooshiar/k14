<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Potential customers · K14</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Potential customers: every company we researched, as a searchable table and grid. Data: companies.json (built from the old deck + research). */
:root{--ink:#181818;--ink2:#4F5666;--mute:#7C8494;--rule:#E3E6EB;--page:#FAF9F5;--green:#3F7F2C;--red:#B4321F;--amber:#A66A00;
  --sans:"Geist",ui-sans-serif,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.w{max-width:1280px;margin:0 auto;padding:40px 32px 64px}
h1{margin:0 0 22px;font-weight:500;font-size:30px;letter-spacing:-.03em}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px}
.sb{display:flex;align-items:baseline;gap:8px;padding:9px 13px;background:#fff;border:1px solid var(--rule);border-radius:10px;font-size:13px;color:var(--ink2)}
.sb b{font-weight:600;font-size:16px;color:var(--ink)}.sb.g b{color:var(--green)}.sb.r b{color:var(--red)}
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.vw{display:inline-flex;gap:2px;padding:3px;border-radius:8px;background:#EEF0F3}
.vw button{all:unset;cursor:pointer;font:500 12px/1 var(--mono);padding:8px 12px;border-radius:6px;color:#5B6170}
.vw button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tbar input,.tbar select{font:400 13px/1 var(--sans);color:var(--ink);background:#fff;border:1px solid #DDE1E7;border-radius:8px;padding:0 10px;height:34px}
.tbar input{width:230px}.tbar select{max-width:170px}.tbar input:focus,.tbar select:focus,.vw button:focus-visible{outline:2px solid var(--green);outline-offset:0}
.tbar .n{margin-left:auto;font:500 12px/1 var(--mono);color:var(--mute)}
.tbar .clr{all:unset;cursor:pointer;font:500 12px/1 var(--mono);color:var(--mute);padding:8px 6px}.tbar .clr:hover{color:var(--ink)}
/* table */
.tw{background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:#FBFBFA;text-align:left;font:500 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mute);padding:11px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;user-select:none}
th.on{color:var(--ink)}
td{padding:10px 12px;border-bottom:1px solid #F0F1F4;vertical-align:top}
tr.r{cursor:pointer}tr.r:hover td{background:#FAFAF7}tr.r.open td{background:#F4F7F1}
td.nm b{font-weight:500}td.nm .p{display:block;color:var(--mute);font-size:12px;margin-top:3px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.num{font-family:var(--mono);font-size:12px;white-space:nowrap}
td.lk{white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{font:500 10.5px/1 var(--mono);padding:4px 7px;border-radius:99px;background:#F1F2F4;color:var(--ink2);white-space:nowrap}
.chip.app{background:#EEF4EA;color:#2F5F22}
.fit{display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1 var(--mono);white-space:nowrap;color:var(--ink2)}
.fit i{width:8px;height:8px;border-radius:50%;background:#C9CED8}.fit.best i{background:var(--green)}.fit.call i{background:var(--amber)}.fit.out i{background:var(--red)}
.lnk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;color:var(--ink2);text-decoration:none;font:600 11px/1 var(--sans);border:1px solid var(--rule);margin-right:4px}
.lnk:hover{border-color:var(--ink2);color:var(--ink)}
tr.det td{background:#FBFCFA;padding:14px 16px 18px}
.dg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.dg h5{margin:0 0 6px;font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.dg p,.dg li{margin:0;font-size:13px;line-height:1.45;color:var(--ink)}.dg ul{margin:0;padding-left:16px}
.dg .y li::marker{color:var(--green)}.dg .x li::marker{color:var(--red)}
/* grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:10px;padding:14px;background:#fff;border:1px solid var(--rule);border-radius:10px;min-width:0}
.card:hover{border-color:#C6CCD5;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h4{margin:0;font:500 16px/1.2 var(--sans);letter-spacing:-.01em}
.card .p{font-size:12.5px;line-height:1.4;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.card .yx{display:flex;flex-direction:column;gap:5px;font-size:12px;line-height:1.35}
.card .yx span{display:flex;gap:6px}.card .yx span::before{flex:none;font:600 12px/1.35 var(--mono)}
.card .yx .y::before{content:"+";color:var(--green)}.card .yx .x::before{content:"−";color:var(--red)}
.card .yx span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ft{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding-top:10px;margin-top:auto;border-top:1px solid #F0F1F4;font:500 11px/1 var(--mono);color:var(--mute)}
.card .ft .lks{margin-left:auto}
.empty{padding:40px;text-align:center;color:var(--mute)}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dg{grid-template-columns:1fr}.w{padding:28px 16px}}
@media (max-width:520px){.grid{grid-template-columns:1fr}.tbar input{width:100%}}
</style>
<style id="k14look">
/* same look as the progress page (design O, 2026-10-23): near-black text, little grey, 6-8px corners, dark chips */
:root{--ink2:#3A3F4A;--mute:#4A4F59;--rule:#E3E6EA}
h1{letter-spacing:-.035em}
.tbar input,.tbar select{border-color:#C4C9D0;border-radius:6px}
.vw{background:#14161A;border-radius:7px}.vw button{color:#C9CED8;border-radius:5px}.vw button.on{background:#fff;color:#181818}
.tw,.card{border-color:#DADDE2;border-radius:8px}
th{background:#fff;color:#181818;box-shadow:0 1px 0 #181818;border-bottom:0}
td{border-bottom:1px solid #EDEFF2;color:#181818}td.num{color:#181818}
td.nm .p,.card .p{color:#3A3F4A}
.chip{background:#14161A;color:#fff;border-radius:5px}.chip.app{background:#E3F0DC;color:#2F5F22}
.lnk{border-color:#C4C9D0;border-radius:5px;color:#181818}
.card .ft{color:#3A3F4A;border-top-color:#EDEFF2}
.fit{color:#181818}.fit i{width:9px;height:9px}.fit.out i{background:#E07A6B}
tr.r:hover td{background:#F6F9F3}tr.r.open td{background:#EEF5E9}
</style><style id="tightcss">
/* tighter table: only as wide as needed, smaller rows, long text cut */
.tw{display:inline-block;max-width:100%}table{width:auto}
td{padding:11px 10px}th{padding:11px 10px}
td.nm b{display:block;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.nm .p{max-width:240px}
td .chips{flex-wrap:nowrap;max-width:200px;overflow:hidden}
.chip{max-width:150px;overflow:hidden;text-overflow:ellipsis}
td.num{white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
</style><style id="alignnav">
:root{--navl:max(40px,calc((100vw - 1040px) / 2 + 40px))}
.w{max-width:none!important;margin:0!important;padding-left:var(--navl)!important;padding-right:32px!important}
@media (max-width:900px){:root{--navl:16px}}
</style><style id="colmenu">
/* column picker above the top-right of a table (2026-10-23) */
.tcw{display:inline-block;max-width:100%;vertical-align:top}
.tch{display:flex;justify-content:flex-end;margin:0 0 6px;position:relative}
.tcb{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--mono,ui-monospace,monospace);color:#181818;padding:6px 9px;border:1px solid #C4C9D0;border-radius:6px;background:#fff}
.tcb:hover{border-color:#181818}.tcb svg{width:13px;height:13px}
.tcp{position:absolute;right:0;top:calc(100% + 4px);z-index:30;background:#fff;border:1px solid #C4C9D0;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;min-width:150px}
.tcp label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;font:400 13px/1 var(--sans,system-ui);color:#181818;cursor:pointer;white-space:nowrap}
.tcp label:hover{background:#F1F6EC}.tcp input{accent-color:#181818;margin:0}
.tcw.nogrid .tch{display:none}
</style>
<script id="coljs">
/* colMenu(wrap, tableSel, names, key, keep): checkbox menu that hides table columns by index; choice kept per browser */
function colMenu(wrap,tsel,names,key,keep){
  let hid=[];try{hid=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
  const st=document.createElement('style');document.head.appendChild(st);
  const apply=()=>{st.textContent=hid.map(n=>{const i=names.indexOf(n)+1;return i?`${tsel} tr:not(.det)>:nth-child(${i}){display:none}`:''}).join('')};
  const h=document.createElement('div');h.className='tch';
  h.innerHTML=`<button class="tcb" type="button" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M6 2.5v11M10 2.5v11"/></svg>Columns</button><div class="tcp" hidden>${names.map(n=>n===keep?'':`<label><input type="checkbox" value="${n}"${hid.includes(n)?'':' checked'}>${n}</label>`).join('')}</div>`;
  wrap.prepend(h);const b=h.querySelector('.tcb'),p=h.querySelector('.tcp');
  b.onclick=e=>{e.stopPropagation();p.hidden=!p.hidden;b.setAttribute('aria-expanded',!p.hidden)};
  p.onclick=e=>e.stopPropagation();
  p.onchange=e=>{const n=e.target.value;hid=e.target.checked?hid.filter(x=>x!==n):[...hid,n];try{localStorage.setItem(key,JSON.stringify(hid))}catch(x){}apply()};
  document.addEventListener('click',()=>{p.hidden=true;b.setAttribute('aria-expanded',false)});apply()}
</script>
<style id="custtight">
/* same table look as Design progress (2026-10-23): one-line rows, info icon, green hover, filters on one line */
.tbar{flex-wrap:nowrap;gap:6px}.tbar input{width:auto;flex:1 1 0;min-width:110px}.tbar select{flex:0 1 auto;field-sizing:content;min-width:0;max-width:none;padding:0 4px 0 8px;font-size:12.5px;text-overflow:ellipsis}
.tbar .n{flex:none;white-space:nowrap;margin-left:4px}.tbar .clr{flex:none}.tbar .vw{flex:none}
#out table{font-size:13.5px}
#out th{color:#181818;box-shadow:0 1px 0 #181818}
#out td{padding:9px 14px 9px 0;vertical-align:middle;white-space:nowrap}#out th{padding:11px 14px 11px 0}
#out td:first-child,#out th:first-child{padding-left:14px}
#out td.nm b{display:inline-block;max-width:200px;vertical-align:middle}
#out tr.r:hover td{background:#F1F6EC}
#out td .chips{flex-direction:column;align-items:flex-start;gap:3px;max-width:none}
#out td .chips .cl{display:flex;gap:4px}
.ci{all:unset;cursor:pointer;width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font:italic 600 10px/1 var(--sans);background:#fff;border:1px solid #181818;color:#181818;margin-left:6px;vertical-align:middle}
.ci:hover,tr.open .ci{background:#181818;color:#fff}
#out tr.det td{white-space:normal}
.dg .kw{margin-top:14px;grid-column:1/-1}.dg .kw p{color:#3A3F4A;font-size:12.5px}
</style><style id="colbar">/* Columns button sits at the right end of the filter row (2026-10-27) */.tch.inbar{margin:0 0 0 auto;flex:none}.tcb{padding:5px 8px;font-size:11.5px}</style></head>
<body>
<div class="w">
<h1>Potential customers</h1>

<div class="tbar">
  <div class="vw" role="tablist" aria-label="View"><button data-v="grid" role="tab">Grid</button><button data-v="table" role="tab">Table</button></div>
  <input id="q" type="search" placeholder="Search company, product, problem" aria-label="Search">
  <select id="fApp" aria-label="App"><option value="">All apps</option></select>
  <select id="fCat" aria-label="Space"><option value="">All spaces</option></select>
  <select id="fFit" aria-label="Fit"><option value="">Any fit</option><option>Best fit</option><option>Worth a call</option><option>Not for us</option><option>Researched</option></select>
  <select id="fSize" aria-label="Size"><option value="">Any size</option><option value="s">1–50 people</option><option value="m">51–200</option><option value="l">201–1000</option><option value="xl">1000+</option></select>
  <select id="fFund" aria-label="Funding"><option value="">Any funding</option><option value="a">Under $10M</option><option value="b">$10–50M</option><option value="c">$50–250M</option><option value="d">$250M+</option></select>
  <select id="fYear" aria-label="Founded"><option value="">Any year</option><option value="a">2023 or later</option><option value="b">2020–2022</option><option value="c">2015–2019</option><option value="d">Before 2015</option></select>
  <select id="fGeo" aria-label="Country"><option value="">Any country</option></select>
  <button class="clr" id="clr" type="button">Clear</button>
  <span class="n" id="n"></span>
</div>
<div class="tcw" id="tcw"><div id="out"></div></div>
</div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
let C=[],VIEW='grid',SORT='fit',DIR=1,OPEN=null;try{VIEW=localStorage.getItem('cust-view')||'grid'}catch(e){}
const FITO={'Best fit':0,'Worth a call':1,'Researched':2,'Not for us':3},FITC={'Best fit':'best','Worth a call':'call','Not for us':'out'};
const money=m=>m==null?'—':m>=1000?'$'+(m/1000).toFixed(m%1000?1:0)+'B':'$'+(m<10?m.toFixed(m%1?1:0):Math.round(m))+'M';
const empN=e=>{if(!e)return null;const m=String(e).match(/(\d[\d,]*)/);return m?+m[1].replace(/,/g,''):null};
const sizeB=c=>{const n=empN(c.employees);return n==null?'':n<=50?'s':n<=200?'m':n<=1000?'l':'xl'};
const fundB=c=>c.raised_m==null?'':c.raised_m<10?'a':c.raised_m<50?'b':c.raised_m<250?'c':'d';
const yearB=c=>!c.founded?'':c.founded>=2023?'a':c.founded>=2020?'b':c.founded>=2015?'c':'d';
const geo=c=>(c.country||(c.hq||'').split(',').pop()||'').trim();
const links=c=>(c.website?`<a class="lnk" href="${esc(c.website)}" target="_blank" rel="noopener" title="Website" onclick="event.stopPropagation()">↗</a>`:'')+(c.linkedin?`<a class="lnk" href="${esc(c.linkedin)}" target="_blank" rel="noopener" title="LinkedIn" onclick="event.stopPropagation()">in</a>`:'');
const fitTag=c=>`<span class="fit ${FITC[c.fit]||''}"><i></i>${esc(c.fit)}</span>`;
const what=c=>c.problem||c.project||c.product||'';
function opts(sel,vals){const s=$(sel);[...new Set(vals)].filter(Boolean).sort().forEach(v=>s.add(new Option(v,v)))}
function F(){return {q:$('q').value.trim().toLowerCase(),app:$('fApp').value,cat:$('fCat').value,fit:$('fFit').value,size:$('fSize').value,fund:$('fFund').value,year:$('fYear').value,geo:$('fGeo').value}}
function pass(c,f){
  if(f.q&&![c.name,c.product,c.problem,c.project,c.buyer,c.hq,c.kw,...c.apps,...c.cats,...c.why,...c.why_not].join(' ').toLowerCase().includes(f.q))return false;
  if(f.app&&!c.apps.includes(f.app))return false;if(f.cat&&!c.cats.includes(f.cat))return false;if(f.fit&&c.fit!==f.fit)return false;
  if(f.size&&sizeB(c)!==f.size)return false;if(f.fund&&fundB(c)!==f.fund)return false;if(f.year&&yearB(c)!==f.year)return false;if(f.geo&&geo(c)!==f.geo)return false;return true}
const KEY={name:c=>c.name.toLowerCase(),fit:c=>FITO[c.fit]*1e4-(c.raised_m||0)/1e3,raised:c=>c.raised_m??-1,founded:c=>c.founded??0,size:c=>empN(c.employees)??-1,geo:c=>geo(c),apps:c=>c.apps.join(',')||'~',cats:c=>c.cats.join(',')||'~'};
function sortBy(k){if(SORT===k)DIR=-DIR;else{SORT=k;DIR=(k==='name'||k==='fit'||k==='geo'||k==='apps'||k==='cats')?1:-1}draw()}
function th(l,k){return `<th class="${SORT===k?'on':''}" onclick="sortBy('${k}')">${l}${SORT===k?(DIR>0?' ↑':' ↓'):''}</th>`}
function details(c){const li=a=>a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p>—</p>';
  return `<div class="dg"><div><h5>What they do</h5><p>${esc(c.product||'—')}</p>${c.buyer?`<h5 style="margin-top:12px">Sells to</h5><p>${esc(c.buyer)}</p>`:''}${what(c)&&what(c)!==c.product?`<h5 style="margin-top:12px">What we would design</h5><p>${esc(what(c))}</p>`:''}${c.hard?`<h5 style="margin-top:12px">Why it is hard</h5><p>${esc(c.hard)}</p>`:''}</div>
  <div class="y"><h5>Why work with them</h5>${li(c.why)}</div><div class="x"><h5>Why not</h5>${li(c.why_not)}
  <h5 style="margin-top:12px">Facts</h5><p>${[c.stage,c.valuation?'Valued '+c.valuation:'',c.employees?c.employees+' people':'',c.hq].filter(Boolean).map(esc).join(' · ')||'—'}</p>${c.source?`<p style="margin-top:6px"><a href="${esc(c.source)}" target="_blank" rel="noopener">Source ↗</a></p>`:''}</div>${c.kw?`<div class="kw"><h5>Keywords</h5><p>${esc(c.kw)}</p></div>`:''}</div>`}
function draw(){
  const f=F(),k=KEY[SORT],R=C.filter(c=>pass(c,f)).sort((a,b)=>{const x=k(a),y=k(b);return (x<y?-1:x>y?1:0)*DIR});
  $('tcw').classList.toggle('nogrid',VIEW==='grid');$('tcw').style.display=VIEW==='grid'?'block':'';$('n').textContent=R.length===C.length?`${C.length} companies`:`${R.length} of ${C.length}`;
  document.querySelectorAll('.vw button').forEach(b=>{b.classList.toggle('on',b.dataset.v===VIEW);b.setAttribute('aria-selected',b.dataset.v===VIEW)});
  if(!R.length){$('out').innerHTML='<div class="empty">No companies match these filters.</div>';return}
  if(VIEW==='grid'){$('out').innerHTML=`<div class="grid">${R.map(c=>`<article class="card"><div class="hd"><h4>${esc(c.name)}</h4>${fitTag(c)}</div>
    <div class="chips">${c.apps.slice(0,3).map(a=>`<span class="chip app">${esc(a)}</span>`).join('')}${c.cats.slice(0,1).map(a=>`<span class="chip">${esc(a)}</span>`).join('')}</div>
    <div class="p">${esc(what(c))}</div>
    <div class="yx">${c.why[0]?`<span class="y">${esc(c.why[0])}</span>`:''}${c.why_not[0]?`<span class="x">${esc(c.why_not[0])}</span>`:''}</div>
    <div class="ft"><span>${money(c.raised_m)}</span>${c.founded?`<span>${c.founded}</span>`:''}${c.employees?`<span>${esc(c.employees)}</span>`:''}${geo(c)?`<span>${esc(geo(c))}</span>`:''}<span class="lks">${links(c)}</span></div></article>`).join('')}</div>`;return}
  $('out').innerHTML=`<div class="tw"><table><thead><tr>${th('Company','name')}${th('Fit','fit')}${th('Apps','apps')}${th('Raised','raised')}<th>Stage</th>${th('Founded','founded')}${th('Size','size')}${th('Country','geo')}<th>Links</th></tr></thead><tbody>${R.map(c=>`<tr class="r${OPEN===c.name?' open':''}" data-n="${esc(c.name)}"><td class="nm"><b title="${esc(what(c))}">${esc(c.name)}</b><button class="ci" type="button" title="Details" aria-label="Details">i</button></td><td>${fitTag(c)}</td><td><div class="chips">${c.apps.length||!c.cats.length?`<span class="cl">${c.apps.map(a=>`<span class="chip app">${esc(a)}</span>`).join('')||'—'}</span>`:''}${c.cats.length?`<span class="cl">${c.cats.map(a=>`<span class="chip">${esc(a)}</span>`).join('')}</span>`:''}</div></td><td class="num">${money(c.raised_m)}</td><td class="num">${esc(c.stage||'—')}</td><td class="num">${c.founded||'—'}</td><td class="num">${esc(c.employees||'—')}</td><td class="num">${esc(geo(c)||'—')}</td><td class="lk">${links(c)}</td></tr>${OPEN===c.name?`<tr class="det"><td colspan="9">${details(c)}</td></tr>`:''}`).join('')}</tbody></table></div>`;
  document.querySelectorAll('tr.r').forEach(tr=>tr.onclick=()=>{OPEN=OPEN===tr.dataset.n?null:tr.dataset.n;draw()})}
function summary(){const n=f=>C.filter(c=>c.fit===f).length,tot=C.reduce((s,c)=>s+(c.raised_m||0),0);
  $('sum').innerHTML=`<div class="sb"><b>${C.length}</b> companies</div><div class="sb g"><b>${n('Best fit')}</b> best fit</div><div class="sb"><b>${n('Worth a call')}</b> worth a call</div><div class="sb r"><b>${n('Not for us')}</b> not for us</div><div class="sb"><b>${money(tot)}</b> raised in total</div>`}
colMenu($('tcw'),'#out table',['Company','Fit','Apps','Raised','Stage','Founded','Size','Country','Links'],'cust-hide','Company');{const h=document.querySelector('.tch'),b=document.querySelector('.tbar');if(h&&b){h.classList.add('inbar');b.appendChild(h)}}
fetch('companies.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{C=d;opts('fApp',C.flatMap(c=>c.apps));opts('fCat',C.flatMap(c=>c.cats));opts('fGeo',C.map(geo));draw()});
['q','fApp','fCat','fFit','fSize','fFund','fYear','fGeo'].forEach(id=>$(id).addEventListener('input',draw));
document.querySelectorAll('.vw button').forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;try{localStorage.setItem('cust-view',VIEW)}catch(e){}draw()});
$('clr').onclick=()=>{['q','fApp','fCat','fFit','fSize','fFund','fYear','fGeo'].forEach(id=>$(id).value='');draw()};
</script>
</body>
</html>

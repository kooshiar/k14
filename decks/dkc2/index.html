<title>Decks · K14</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#14161A;--body:#2A2F3A;--mut:#596070;--line:#C6CCD5;--soft:#EDEFF2;--page:#FAF9F5;--green:#2E8A1F;--hov:#F1F6EC;--red:#C2410C;
 --sans:"Geist",ui-sans-serif,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit}
.w{padding:22px 40px 56px;max-width:1360px}
.top{display:flex;justify-content:flex-end;margin-bottom:18px;position:relative}
.top input{width:240px;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:400 13.5px var(--sans);background:#fff}
.res{position:absolute;right:0;top:40px;width:340px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.1);z-index:5;max-height:360px;overflow:auto}
/* tiles row */
.row{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:34px}
.tl{position:relative;border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:1/1.08;min-width:0;border:1px solid var(--line);background:#fff;overflow:hidden}
.tl b{font:600 14.5px/1.15 var(--sans);letter-spacing:-.015em}.tl small{font:400 11px/1 var(--mono);color:var(--mut)}
.tl svg{width:52px;height:52px;flex:none}
.tl .x{all:unset;position:absolute;top:8px;right:9px;cursor:pointer;font:500 13px/1 var(--mono);opacity:0;color:inherit}.tl:hover .x{opacity:.6}
.tl.add{border-style:dashed;align-items:center;justify-content:center;color:var(--mut);cursor:pointer;background:transparent}
.tl.add b{font:500 13px/1.3 var(--mono);text-align:center}
.nm{display:flex;flex-direction:column;gap:6px}
.nums{display:flex;flex-direction:column;gap:9px}.nums div{display:flex;align-items:baseline;gap:7px}.nums b{font:600 24px/1 var(--sans);letter-spacing:-.03em}.nums span{font:400 11.5px/1.2 var(--sans);color:var(--mut)}
.tl .hd{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
/* type marks */
.tk{flex:none;width:18px;height:14px;border-radius:3px;position:relative;border:1.5px solid var(--c);display:inline-block}
.tk.deck{--c:#14161A}.tk.deck::after{content:"";position:absolute;left:3px;right:3px;bottom:2px;height:2px;background:var(--c)}
.tk.dash{--c:#2E8A1F;background:linear-gradient(to top,var(--c) 0 40%,transparent 40%) 3px 100%/3px 100% no-repeat,linear-gradient(to top,var(--c) 0 75%,transparent 75%) 8px 100%/3px 100% no-repeat}
.tk.table{--c:#0057FF;background:repeating-linear-gradient(to bottom,transparent 0 3px,var(--c) 3px 4px)}
.tk.gallery{--c:#7A3FFF;background:conic-gradient(var(--c) 25%,transparent 0 50%,var(--c) 0 75%,transparent 0) 0 0/8px 6px}
.tk.form{--c:#C2410C}.tk.form::after{content:"";position:absolute;left:3px;right:6px;top:4px;height:1.5px;background:var(--c);box-shadow:0 3px 0 var(--c)}
.tk.site{--c:#596070;border-radius:50%;width:14px}
/* columns */
.pipe{display:grid;grid-template-columns:1fr 1.15fr 1fr 1fr 1fr;gap:14px;align-items:start}
.st{display:flex;flex-direction:column;gap:10px;min-width:0}
.st .sh{font:600 15px/1 var(--sans);padding:2px 2px 4px;display:flex;gap:8px;align-items:center}.st .sh i{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font:500 10.5px/20px var(--mono);text-align:center;font-style:normal}
.bx{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bx h2{margin:0;padding:10px 13px;font:600 13.5px/1 var(--sans);border-bottom:1px solid var(--soft);display:flex;justify-content:space-between}.bx h2 small{font:400 11px/1 var(--mono);color:var(--mut)}
.it{display:flex;align-items:center;gap:9px;padding:8px 13px;border-bottom:1px solid var(--soft);font-size:13.5px}.it:last-child{border-bottom:0}.it:hover{background:var(--hov)}
.it b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it em{font:400 11px/1 var(--mono);font-style:normal;color:var(--mut);white-space:nowrap}
.it .pin{all:unset;cursor:pointer;opacity:0;font-size:12px;width:14px;text-align:center}.it:hover .pin{opacity:.55}.it .pin:hover{opacity:1}
.mo{all:unset;cursor:pointer;display:block;padding:8px 13px;font:500 11.5px/1 var(--mono);color:var(--mut)}.mo:hover{color:var(--ink)}
.none{font:400 12.5px/1 var(--mono);color:var(--mut);padding:12px 13px;border:1px dashed var(--line);border-radius:12px}
/* ---- 5 tile styles ---- */
/* 1 dark pinned, white recent, dark alert/news */
.v1 .pin1{background:var(--c,#14161A);color:#fff;border:0}.v1 .pin1 small{color:rgba(255,255,255,.65)}
.v1 .rec{background:#fff}.v1 .inf{background:#14161A;color:#fff;border:0}.v1 .inf span{color:#9AA0AA}.v1 .inf.al b{color:#FF8A65}.v1 .inf.nw b{color:#6CCB4E}
/* 2 colour field per pinned, recent outlined, alerts tinted */
.v2 .pin1{background:var(--c);color:#fff;border:0}.v2 .pin1 small{color:rgba(255,255,255,.75)}
.v2 .rec{background:transparent}.v2 .inf.al{background:#FCEBE5;border-color:#F3C3B1}.v2 .inf.al b{color:var(--red)}.v2 .inf.nw{background:#E8F3E3;border-color:#BFDDB2}.v2 .inf.nw b{color:var(--green)}
/* 3 launcher squares: icon fills the tile, name under */
.v3 .tl{aspect-ratio:auto;padding:0;border:0;background:transparent;gap:8px;justify-content:flex-start;overflow:visible}
.v3 .ic{aspect-ratio:1;border-radius:22%;display:grid;place-items:center;background:#fff;border:1px solid var(--line)}
.v3 .pin1 .ic{background:var(--c);border:0;color:#fff}.v3 .ic svg{width:46%;height:46%}
.v3 .rec .ic{color:var(--ink)}.v3 .rec .ic .tk{transform:scale(2.2)}
.v3 .inf .ic{background:#14161A;color:#fff;place-items:stretch;padding:14%;border:0}.v3 .inf .ic .nums b{font-size:20px}.v3 .inf .ic .nums span{color:#9AA0AA;font-size:10.5px}.v3 .inf.al .ic b{color:#FF8A65}.v3 .inf.nw .ic b{color:#6CCB4E}
.v3 .tl.add{aspect-ratio:1;border:1px dashed var(--line);border-radius:22%;justify-content:center}.v3 .lb{padding:0 4px;display:flex;flex-direction:column;gap:4px}
/* 4 wide: icon top-left, big name, meta bottom; recent shows age large */
.v4 .tl{aspect-ratio:1/1.25}.v4 .pin1{background:#14161A;color:#fff;border:0}.v4 .pin1 svg{color:var(--c)}.v4 .pin1 small{color:#9AA0AA}
.v4 .rec .age{font:600 26px/1 var(--sans);letter-spacing:-.03em}.v4 .inf{border-color:#14161A}.v4 .inf.al b{color:var(--red)}.v4 .inf.nw b{color:var(--green)}
/* 5 minimal: white tiles, coloured icon, thin colour bar on top of pinned */
.v5 .tl{border-color:var(--soft);box-shadow:0 1px 2px rgba(0,0,0,.04)}.v5 .pin1{border-top:5px solid var(--c)}.v5 .pin1 svg{color:var(--c)}
.v5 .inf.al{border-top:5px solid var(--red)}.v5 .inf.nw{border-top:5px solid var(--green)}.v5 .inf b{font-size:28px}
@media (max-width:1100px){.row{grid-template-columns:repeat(4,1fr)}.pipe{grid-template-columns:1fr 1fr}}
</style></head><body><div class="w" id="w"></div>

 if(V==='3')return `<div class="tl inf ${cls}"><div class="ic">${n}</div><div class="lb"><b>${head}</b></div></div>`;
 return `<div class="tl inf ${cls}"><span class="hd">${head}</span>${n}</div>`}
const box=(t,xs)=>{const id='b'+Math.random().toString(36).slice(2,7);return `<section class="bx"><h2>${esc(t)}<small>${xs.length}</small></h2>${xs.slice(0,5).map(it).join('')}${xs.length>5?`<div id="${id}" hidden>${xs.slice(5).map(it).join('')}</div><button class="mo" data-m="${id}">+${xs.length-5}</button>`:''}</section>`};
const it=x=>`<a class="it" href="${x.u}"><span class="tk ${x.k}"></span><b>${esc(x.t)}</b><em>${esc(x.n)}</em><button class="pin" data-pin="${x.u}" title="Pin">☆</button></a>`;
function draw(){const rec=L.filter(x=>x.ts&&!PINS.includes(x.u)).sort((a,b)=>b.ts-a.ts).slice(0,3);
 const pins=PINS.slice(0,3).map(pinTile).join('')+(PINS.length<3?Array(3-PINS.length).fill(`<div class="tl add" data-add="1" title="Pin with ☆ on any link"><b style="font-size:26px">+</b></div>`).join(''):'');
 const by=f=>L.filter(f),P=by(x=>x.a==='problems');
 const col=(i,h,boxes)=>`<div class="st"><div class="sh"><i>${i}</i>${h}</div>${boxes.join('')||'<div class="none">None yet</div>'}</div>`;
 $('w').className='w v'+V;
 $('w').innerHTML=`<div class="top"><input id="q" type="search" placeholder="Search" aria-label="Search"><div class="res" id="res" hidden></div></div>
 <div class="row">${pins}${rec.map(recTile).join('')}${infTile('al','Alerts',AL)}${infTile('nw','News',NW)}</div>
 <div class="pipe">${col(1,'Engine',[box('Models and agents',by(x=>x.box==='Eng')),box('Design',by(x=>x.u==='/decks/design/'))])}
 ${col(2,'Problems',[box('Reports',P.filter(x=>x.k!=='deck'&&x.k!=='site')),box('Problem decks',P.filter(x=>x.k==='deck'&&x.box==='Apps')),box('Public',P.filter(x=>x.k==='site'||x.box==='Apps and tools'))])}
 ${col(3,'Programs',[box('Partners',by(x=>x.a==='programs'))])}
 ${col(4,'Spinoffs',[])}
 ${col(5,'Pitch',[box('Main',by(x=>x.box==='Main decks')),box('Leads',by(x=>['/decks/customers/','/decks/visits'].includes(x.u))),box('Comms',by(x=>x.a==='comms'))])}</div>`;
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{$(b.dataset.m).hidden=false;b.remove()});
 document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();if(!PINS.includes(b.dataset.pin)){PINS=[b.dataset.pin,...PINS].slice(0,3);savePins();draw()}});
 document.querySelectorAll('[data-un]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();PINS=PINS.filter(u=>u!==b.dataset.un);savePins();draw()});
 $('q').oninput=()=>{const q=$('q').value.trim().toLowerCase(),r=$('res');if(!q){r.hidden=true;return}const m=L.filter(x=>x.t.toLowerCase().includes(q)).slice(0,12);r.innerHTML=m.map(it).join('')||'<div class="it"><b>Nothing found</b></div>';r.hidden=false}}
draw();
</script></body></html>

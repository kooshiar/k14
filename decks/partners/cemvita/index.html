<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Cemvita · K14</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#181818;--mute:#596070;--rule:#C6CCD5;--navl:max(40px,calc((100vw - 1040px) / 2 + 40px))}
body{margin:0;background:#FAF9F5;color:var(--ink);font-family:"Geist",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.w{padding:48px 40px 64px var(--navl);max-width:1400px}
.bk{font:500 12px/1 "Geist Mono",ui-monospace,monospace;color:var(--mute);text-decoration:none}.bk:hover{color:var(--ink)}
h1{margin:14px 0 28px;font-weight:600;font-size:28px;letter-spacing:-.03em}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px 22px}
.gi{display:flex;flex-direction:column;gap:6px;color:inherit;text-decoration:none}
.pic{aspect-ratio:16/9;border-radius:14px;overflow:hidden;position:relative;background:#E6E3DC;border:1px solid var(--rule);transition:transform .2s;container-type:inline-size}
.gi:hover .pic{transform:translateY(-3px);border-color:var(--ink)}
.pic iframe{position:absolute;left:0;top:0;width:1280px;height:720px;border:0;transform:scale(calc(100cqw / 1280px));transform-origin:0 0;pointer-events:none}
.gi b{font-weight:600;font-size:16px;letter-spacing:-.015em;margin-top:6px}.gi span{font:400 12px/1 "Geist Mono",ui-monospace,monospace;color:var(--mute)}
@media (max-width:900px){.w{padding:28px 16px}}
</style>
</head>
<body>
<div class="w"><a class="bk" href="/decks/">← Decks</a><h1>Cemvita</h1><div class="gg"><a class="gi" href="/decks/cemvita/"><div class="pic"><iframe src="/decks/cemvita/?embed=1" loading="lazy" tabindex="-1" aria-hidden="true" onload="try{this.contentDocument.documentElement.classList.add('fb')}catch(e){}"></iframe></div><b>Work together</b><span>3 pages</span></a></div></div>
</body>
</html>

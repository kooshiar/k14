<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>v5 Metal Tests · K14</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
:root{--ink:#14161A;--mut:#596070;--line:#E3E6EB;--bg:#F6F5F1;--card:#fff;--g:#2E8A1F;--r:#C2261C;--blue:#2F8FE0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.35 Geist,ui-sans-serif,system-ui,sans-serif}
.w{max-width:1240px;margin:0 auto;padding:40px 24px 60px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{font:600 34px/1.1 Geist,sans-serif;margin:0;letter-spacing:-.01em}
.upd{color:var(--mut);font-size:14px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:48px 0 40px}
.st{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px 18px}
.st b{display:block;font-weight:600;font-size:17px}.st span{color:var(--mut);font-size:13px}
.st i{font-style:normal;font-weight:600;font-size:13px;display:block;margin-bottom:6px;color:var(--mut)}
.st.done{background:#EEF6EA;border-color:#BFDDB0}.st.done i{color:var(--g)}
.st.running{border-color:var(--blue);animation:p 1.6s ease-in-out infinite}.st.running i{color:var(--blue)}
@keyframes p{50%{box-shadow:0 0 0 5px rgba(47,143,224,.18)}}
.score{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:12px;margin-bottom:44px}
.sc{background:var(--card);border-radius:10px;padding:18px;border:1.5px solid var(--line)}
.sc h3{margin:0 0 14px;font:600 16px/1.2 Geist,sans-serif}
.pair{display:flex;gap:10px}.pc{flex:1;border-radius:8px;padding:10px 12px;background:#F3F4F6}
.pc small{display:block;font-size:13px;font-weight:600;opacity:.85}.pc em{font-style:normal;font:600 30px/1.1 Geist,sans-serif}
.pc u{text-decoration:none;display:block;font-size:12px;opacity:.8}
.big .pc em{font-size:44px}
.cls{margin:28px 0 12px;font:600 18px/1.2 Geist,sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.t{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px 8px}
.t.running{border-color:var(--blue);animation:p 1.6s ease-in-out infinite}
.t .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t svg{display:block;width:100%;height:34px;margin-top:6px}
.t .v{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}.t .v b{color:var(--ink);font-weight:600}
.ho{font-size:11px;color:var(--mut);font-weight:500;margin-left:4px}
.mach{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin:0 0 44px}
.mc{flex:1 1 0;min-width:84px;display:flex;flex-direction:column}
.mc .hd{font:600 14px/1.2 Geist,sans-serif;margin-bottom:2px;white-space:nowrap}.mc .pr{font-size:12px;color:var(--mut);margin-bottom:8px}
.stack{display:flex;flex-direction:column-reverse;gap:4px;min-height:260px;background:#EFEDE7;border-radius:8px;padding:6px}
.cell{height:22px;border-radius:4px;font:500 10px/22px Geist,sans-serif;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.f{background:#3E8E2A;color:#fff}.cell.x{background:#C2261C;color:#fff}
.cell.r{background:#fff;border:1.5px solid var(--blue);position:relative;line-height:19px;color:var(--ink)}
.cell.r i{position:absolute;left:0;top:0;bottom:0;background:rgba(47,143,224,.22)}.cell.r span{position:relative}
.mc .ft{font-size:12px;color:var(--mut);margin-top:8px;text-align:center}.mc .ft b{color:var(--ink)}
.mc.box .hd{color:var(--ink)}
.sec{font:600 18px/1.2 Geist,sans-serif;margin:0 0 12px}
@media (max-width:820px){.steps{grid-template-columns:1fr 1fr}.score{grid-template-columns:1fr}}
</style></head><body><div class="w">
<div class="top"><h1>v5 metal tests</h1><span class="upd" id="upd"></span></div>
<div class="steps" id="steps"></div>
<div id="machs"></div>
<div class="score" id="score"></div>
<div id="tests"></div>
</div>
<script>
const CL={'cation-crown':'Crown ethers','metal-chelator':'Chelators','metal-tm':'Transition metals'};
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','+':'⁺','-':'⁻'};
const ion=s=>s.replace(/(\d?[+-])$/,m=>[...m].map(c=>SUP[c]).join(''));
const host=s=>s.replace(/\d?[+-]$/,'');
function mix(a,b,t){return '#'+[1,3,5].map(i=>Math.round(parseInt(a.substr(i,2),16)+(parseInt(b.substr(i,2),16)-parseInt(a.substr(i,2),16))*t).toString(16).padStart(2,'0')).join('')}
function shade(p){const t=Math.min(1,Math.abs(p-.6)/.35);return [p<.6?mix('#FADBD8','#B71C1C',t):mix('#DCEFD2','#1E6B12',t),t>.45?'#fff':'#14161A']}
function pct(ok,n,lab,big){if(!n)return `<div class="pc"><small>${lab}</small><em>–</em><u>no tests yet</u></div>`;const p=ok/n,[bg,fg]=shade(p);
  return `<div class="pc" style="background:${bg};color:${fg}"><small>${lab}</small><em>${Math.round(100*p)}%</em><u>${ok} of ${n} right</u></div>`}
function ago(s){const m=Math.round((Date.now()-Date.parse(s))/6e4);return m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' h ago'}
// number line -30..+5 kcal/mol: lab = black tick, v4 = grey dot, v5 = blue dot
const X=v=>8+(Math.max(-30,Math.min(5,v))+30)/35*184;
function line(t){let s=`<svg viewBox="0 0 200 34"><line x1="8" y1="17" x2="192" y2="17" stroke="#E3E6EB" stroke-width="2"/>`;
  s+=`<line x1="${X(t.lab)}" y1="5" x2="${X(t.lab)}" y2="29" stroke="#14161A" stroke-width="3"/>`;
  if(t.v4!=null)s+=`<circle cx="${X(t.v4)}" cy="17" r="5.5" fill="#B8BEC8"/>`;
  if(t.v5!=null)s+=`<circle cx="${X(t.v5)}" cy="17" r="6.5" fill="#2F8FE0"/>`;return s+'</svg>'}
const f=v=>v==null?'–':(v>0?'+':'')+v.toFixed(1);
function draw(d){
  document.getElementById('upd').textContent=(d.pods&&d.pods.n?`GPUs: box + ${d.pods.n} rented · $${d.pods.per_h}/h · `:'')+'updated '+ago(d.updated);
  const L={done:'✓ done',running:'● running',waiting:'waiting'};
  document.getElementById('steps').innerHTML=d.steps.map((s,i)=>`<div class="st ${s.state}"><i>${i+1} · ${L[s.state]||s.state}</i><b>${s.name}</b><span>${s.note||''}</span></div>`).join('');

  const M=d.machines;let mh='';
  if(M&&M.length){const lab=n=>{const m=n.match(/^(.*?)_([A-Z][a-z]?\d?[+-])_(v5\w*(?:\.\d)?)$/);return m?host(m[1])+' · '+ion(m[2])+' '+m[3].replace('.2',''):n};
    const fin=M.reduce((a,m)=>a+m.finished,0),run=M.reduce((a,m)=>a+m.running.length,0);
    mh=`<div class="sec">Machines <span class="ho">${fin} done · ${run} running</span></div><div class="mach">`+M.map(m=>{
      let c='';for(let k=0;k<m.finished;k++)c+=`<div class="cell f">✓</div>`;
      c+=m.running.map(r=>{const p=r.it==null?0:Math.max(0,Math.min(1,r.it/600));return `<div class="cell r" title="${lab(r.name)}"><i style="width:${Math.round(100*p)}%"></i><span>${Math.round(100*p)}%</span></div>`}).join('');
      return `<div class="mc ${m.id==='box'?'box':''}"><div class="hd">${m.id==='box'?'Our box':m.gpu}</div><div class="pr">${m.id==='box'?m.gpu:'$'+m.price+'/h'}</div><div class="stack">${c}</div><div class="ft"><b>${m.finished}</b> done · <b>${m.running.length}</b> running</div></div>`}).join('')+'</div>'}
  document.getElementById('machs').innerHTML=mh;
  const g=d.groups,ho=g['held-out'];
  let sc=`<div class="sc big"><h3>Held-out, all metals</h3><div class="pair">${pct(...ho.v4,'v4')}${pct(...ho.v5,'v5')}</div></div>`;
  for(const c in CL){const x=g[c];sc+=`<div class="sc"><h3>${CL[c]}</h3><div class="pair">${pct(...x.v4,'v4')}${pct(...x.v5,'v5')}</div></div>`}
  document.getElementById('score').innerHTML=sc;
  let h='';for(const c in CL){const ts=d.tests.filter(t=>t.cls===c),dn=ts.filter(t=>t.state==='done').length;
    h+=`<div class="cls">${CL[c]} <span class="ho">${dn} of ${ts.length} done · kcal/mol</span></div><div class="grid">`+ts.map(t=>`<div class="t ${t.state}"><div class="n">${host(t.host)} · ${ion(t.guest)}${t.split==='test'?'<span class="ho">held-out</span>':''}</div>${line(t)}<div class="v"><span>lab <b>${f(t.lab)}</b></span><span>v4 ${f(t.v4)}</span><span style="color:#2F8FE0">v5 <b style="color:#2F8FE0">${f(t.v5)}</b></span></div></div>`).join('')+'</div>'}
  document.getElementById('tests').innerHTML=h}
function load(){fetch('../v5.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(draw).catch(()=>{})}
load();setInterval(load,60000);
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Lab Set · K14</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--ink:#14161A;--mut:#596070;--line:#E3E6EB;--bg:#F6F5F1;--card:#fff;--g:#2E8A1F;--r:#C2261C;--navl:max(40px,calc((100vw - 1040px)/2 + 40px))}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.35 Geist,ui-sans-serif,system-ui,sans-serif}
.w{padding:40px var(--navl) 60px}
.top{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
h1{font:600 32px/1.1 Geist,sans-serif;margin:0;letter-spacing:-.01em}
.nums{font:500 18px Geist,sans-serif;color:var(--mut)}.nums b{color:var(--g);font-weight:600}
a.back{color:var(--mut);text-decoration:none;font-size:13px}
.grid{display:grid;grid-template-columns:420px auto;gap:28px;align-items:start;margin-top:30px}
.card{background:var(--card);border-radius:10px;padding:16px}
table{border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;width:auto}
td,th{padding:9px 14px;border-top:1px solid var(--line);white-space:nowrap;text-align:left}
th{font-weight:600;border-top:0;font-size:13px}
tr:hover td{background:#F1F6EC}
.n{max-width:300px;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.num{font-family:"Geist Mono",monospace;font-size:13px;text-align:right}
.m{color:var(--mut)}.ok{color:var(--g);font-weight:600}.no{color:var(--r);font-weight:600}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="w">
<a class="back" href="../">← Lab tests</a>
<div class="top" style="margin-top:10px"><h1 id="t">Lab set</h1><span class="nums" id="nums"></span></div>
<div class="grid"><div class="card"><svg id="sc" viewBox="0 0 400 400" width="100%"></svg></div><div id="tb"></div></div>
</div>
<script>
const K=new URLSearchParams(location.search).get('k')||'orig';
const f=v=>v==null||isNaN(v)?'–':(Math.abs(v)>=100?Math.round(v):Math.abs(v)>=10?v.toFixed(1):v.toFixed(2));
function draw(d){
  const S=K==='orig'?d.orig:(d.sets||[]).find(s=>s.key===K)||{};
  document.getElementById('t').textContent=S.name||K;document.title=(S.name||K)+' · K14';
  const pc=S.cmp?Math.round(100*S.right/S.cmp):null;
  document.getElementById('nums').innerHTML=pc==null?'':`<b>${pc}%</b> · ${S.right}/${S.cmp} right · ${S.n} tests`;
  let it=S.items||(d.rows||[]).filter(r=>r.set===K).map(r=>({name:(r.host||'')+' · '+(r.guest||''),exp:r.lab,ours:r.ours,units:'kcal/mol',status:r.status,right:r.right,cmp:r.cmp}));
  const pts=it.filter(x=>typeof x.exp==='number'&&typeof x.ours==='number');
  /* scatter: lab (x) vs ours (y) */
  const sv=document.getElementById('sc');let h='';
  if(pts.length){const xs=pts.map(p=>p.exp),ys=pts.map(p=>p.ours),pad=(a,b)=>{const r=(b-a)||1;return [a-r*.08,b+r*.08]};
    const [x0,x1]=pad(Math.min(...xs),Math.max(...xs)),[y0,y1]=pad(Math.min(...ys),Math.max(...ys)),X=v=>40+(v-x0)/(x1-x0)*340,Y=v=>360-(v-y0)/(y1-y0)*330;
    h+=`<line x1="40" y1="360" x2="380" y2="360" stroke="#C6CCD5"/><line x1="40" y1="30" x2="40" y2="360" stroke="#C6CCD5"/>`;
    h+=`<text x="210" y="392" text-anchor="middle" font-size="12" fill="#596070">lab</text><text x="14" y="195" text-anchor="middle" font-size="12" fill="#596070" transform="rotate(-90 14 195)">ours</text>`;
    h+=pts.map(p=>`<circle cx="${X(p.exp).toFixed(1)}" cy="${Y(p.ours).toFixed(1)}" r="4.5" fill="#2E8A1F" fill-opacity=".75"><title>${(p.name||'').replace(/</g,'')}: lab ${f(p.exp)}, ours ${f(p.ours)}</title></circle>`).join('')}
  sv.innerHTML=h;
  const grp=it.some(x=>x.group);
  document.getElementById('tb').innerHTML=`<table><tr><th>Test</th>${grp?'<th>Group</th>':''}<th class="num">Lab</th><th class="num">Ours</th></tr>${it.map(x=>`<tr><td class="n" title="${(x.name||'').replace(/"/g,'')}">${x.name||x.id}</td>${grp?`<td class="m">${x.group||''}</td>`:''}<td class="num">${f(x.exp)}</td><td class="num">${f(x.ours)}</td></tr>`).join('')}</table>`;
}
function load(){fetch('../../lab.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(draw).catch(()=>{})}
load();setInterval(load,60000);
</script></body></html>

<style>
/* CRP deck for doctors and angel investors. AMD deck style. One 16:9 slide per screen; 6% | text 40% | gap 8% | visual 40% | 6%. White text side, visual on a blue-grey card. */
:root{
  --page:#E9EBEF; --navbg:#FFFFFF; --navln:#DDE1E7; --navtx:#3A3F4A;
  --bg:#FFFFFF; --ink:#0B0D12; --body:#5B6170; --mut:#4E5A6E; --line:#C2CCDA; --fill:#FFFFFF; --fl2:#CBD5E3; --acc:#2F6BFF;
  --card:#D7E1F2; --cardln:#C3CFE5; --good:#00A651; --hot:#E10600;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#14161A;--navbg:#1E2127;--navln:#2C3038;--navtx:#D5D9E0;color-scheme:dark}}
:root[data-theme="dark"]{--page:#14161A;--navbg:#1E2127;--navln:#2C3038;--navtx:#D5D9E0;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);font-family:var(--sans);margin:0;overflow:hidden}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px 16px 72px}
.slide{width:min(100%, calc((100vh - 88px) * 16 / 9));aspect-ratio:16/9;container-type:inline-size;overflow:hidden;position:relative;
  display:none;grid-template-columns:6% 40% 8% 40% 6%;align-items:center;background:var(--bg);border-radius:6px;
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 40px rgba(0,0,0,.08)}
.slide.on{display:grid}
.txt{grid-column:2;display:flex;flex-direction:column;gap:2.2cqw}
.txt h2{margin:0;font:600 3.5cqw/1.08 var(--sans);letter-spacing:-.035em;color:var(--ink);text-wrap:balance}
.txt h2 .n{color:var(--acc)}
.txt p{margin:0;font:400 1.45cqw/1.55 var(--sans);color:var(--body);max-width:34cqw;text-wrap:pretty}
.vis{grid-column:4;min-width:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--cardln);border-radius:10px;padding:2.4cqw 2.2cqw}
.lb,.vis td,.vis th{font:400 .95cqw/1.35 var(--mono);letter-spacing:.01em;color:var(--ink)}
.m{color:var(--mut)!important}.a{color:var(--acc)!important}.g{color:var(--good)!important}
.box{background:var(--fill);border:1px solid var(--fl2);border-radius:4px}
.tb{width:100%;border-collapse:collapse}
.tb th{text-align:left;font-weight:400;color:var(--mut);padding:0 1.2cqw .9cqw 0;border-bottom:1px solid var(--line)}
.tb td{padding:1.05cqw 1.2cqw 1.05cqw 0;border-bottom:1px solid var(--line);vertical-align:top}
.tb tr:last-child td{border-bottom:0}
.tb td:last-child,.tb th:last-child{padding-right:0}
.tb td b{font-weight:500}

/* 1 · floor load bars */
.bars{display:flex;flex-direction:column;gap:1.6cqw}
.bar{display:grid;grid-template-columns:11cqw 1fr;align-items:center;column-gap:1.2cqw}
.bar .tr{height:3.2cqw;position:relative}
.bar .f{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:3px;display:flex;align-items:center;justify-content:flex-end;padding-right:.9cqw}
.bar .f .lb{color:#FFFFFF}
.bar.hi .f{background:var(--acc)}
.bar .wt{position:absolute;left:0;top:-1.8cqw}

/* 3 · pipeline steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);column-gap:.9cqw;position:relative}
.steps::before{content:"";position:absolute;left:12.5%;right:12.5%;top:1.15cqw;height:1px;background:var(--line)}
.st{display:flex;flex-direction:column;align-items:center;gap:1cqw;text-align:center}
.st .d{width:2.3cqw;height:2.3cqw;border-radius:50%;background:var(--ink);color:#FFFFFF;display:grid;place-items:center;position:relative;z-index:1}
.st .d .lb{color:#FFFFFF}
.st.last .d{background:var(--acc)}
.st .box{align-self:stretch;padding:1.2cqw .8cqw;display:flex;flex-direction:column;gap:.7cqw;min-height:11cqw}
.st .num{font:600 2.2cqw/1 var(--sans);letter-spacing:-.03em;color:var(--ink)}
.st.last .num{color:var(--acc)}
.proof{margin-top:2cqw;display:grid;grid-template-columns:1fr 1fr;column-gap:.9cqw}
.proof .box{padding:1.2cqw 1.2cqw;display:flex;flex-direction:column;gap:.8cqw}
.proof .big{font:600 2.2cqw/1 var(--sans);letter-spacing:-.03em}

/* 4 · status */
.dot{display:inline-block;width:.8cqw;height:.8cqw;border-radius:50%;margin-right:.7cqw;vertical-align:.05cqw}
.dot.ok{background:var(--good)}.dot.nx{background:transparent;box-shadow:inset 0 0 0 1.5px var(--acc)}

/* 5 · split of work */
.split{display:grid;grid-template-columns:1fr 1fr;column-gap:.9cqw}
.mol{aspect-ratio:1/1;max-height:30cqw;margin:0 auto}.mol canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;column-gap:.9cqw}.tiles .box{padding:1.3cqw 1.2cqw;display:flex;flex-direction:column;gap:.8cqw}.tiles .big{font:600 2.2cqw/1 var(--sans);letter-spacing:-.03em;color:var(--ink)}.tiles .big.a{color:var(--acc)}
.bar2{display:grid;grid-template-columns:13cqw 1fr 5cqw;align-items:center;column-gap:1cqw;margin-bottom:1.1cqw}.bar2 .tr{height:2.4cqw;background:var(--fill);border:1px solid var(--fl2);border-radius:3px;position:relative}.bar2 .f{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:2px}.bar2.hi .f{background:var(--acc)}
.split .box{padding:1.4cqw 1.3cqw;display:flex;flex-direction:column;gap:1cqw}
.split .hd{font:500 1.15cqw/1.2 var(--sans);color:var(--ink);padding-bottom:.9cqw;border-bottom:1px solid var(--line)}
.terms{margin-top:.9cqw;display:grid;grid-template-columns:repeat(3,1fr);column-gap:.9cqw}
.terms .box{padding:1.1cqw 1.2cqw;display:flex;flex-direction:column;gap:.6cqw}
.terms .big{font:600 1.6cqw/1.1 var(--sans);letter-spacing:-.03em;color:var(--acc);white-space:nowrap}

/* nav */
.nav{position:fixed;right:20px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;z-index:5}
.nav button{width:38px;height:38px;border-radius:8px;border:1px solid var(--navln);background:var(--navbg);color:var(--navtx);font:500 16px/1 var(--mono);cursor:pointer;display:grid;place-items:center}
.nav button:focus-visible{outline:2px solid #2F6BFF;outline-offset:2px}
.nav button:disabled{opacity:.35;cursor:default}
.nav span{font:500 13px/1 var(--mono);color:var(--navtx);min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
@media (max-width:700px){
  body{overflow:auto}.stage{position:static;display:block;padding:16px 16px 80px}
  .slide{width:100%;aspect-ratio:auto;grid-template-columns:1fr;padding:22px 18px;gap:20px;margin-bottom:16px}
  .slide,.slide.on{display:grid}.txt,.vis{grid-column:1}
  .txt h2{font-size:26px}.txt p{font-size:15px;max-width:none}
  .lb,.vis td,.vis th{font-size:11px}.st .num,.proof .big,.terms .big{font-size:20px}.split .hd{font-size:13px}
  .bar{grid-template-columns:96px 1fr}.bar .tr{height:26px}.nav{display:none}
}
.pt td.fin a{color:inherit;text-decoration:none}.pt td.fin a:hover{text-decoration:underline}
.tg span{display:inline-block;font:500 11px/1 var(--mono);color:var(--mut,#7C8494);background:rgba(127,127,127,.12);border-radius:99px;padding:4px 8px;white-space:nowrap}
</style>
<style id="fullpage">/* 2026-10-21: full page, no card or panel around the table, no background colors; the table is the page */
html,body{height:auto!important;overflow:auto!important;background:#FFFFFF!important}
.stage{position:static!important;display:block!important;padding:40px clamp(16px,4vw,56px) 96px!important}
.slide{display:block!important;width:100%!important;max-width:none!important;aspect-ratio:auto!important;background:transparent!important;box-shadow:none!important;border-radius:0!important;padding:0!important;overflow:visible!important;container-type:normal!important}
.slide .txt{margin-bottom:28px}
.slide .txt h2{font-size:clamp(26px,2.6vw,40px)!important}
.vis{background:transparent!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important;max-height:none!important;overflow:visible!important}
#tbl{width:100%!important}
#tbl td{padding-top:11px!important;padding-bottom:11px!important}
#tbl td.p{font-size:15px!important}
#tbl td.p a,#tbl td.p b{font-size:15px!important}
.tg span{font-size:13px!important;padding:5px 10px!important}
#tbl th{background:#FFFFFF!important}
.nav{display:none!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) html,:root:not([data-theme="light"]) body{background:#111317!important}}
</style></head>
<body>
<div class="stage">
<section class="slide full on" aria-label="1"><div class="txt"><h2 id="ttl">Spinoff design runs</h2></div>
<div class="vis"><table class="tb pt" id="tbl"></table></div></section>
</div>
<nav class="nav" aria-label="Pages"><button id="prev" aria-label="Previous page">&larr;</button><span id="pg">1 / 1</span><button id="next" aria-label="Next page">&rarr;</button></nav>
<style>.nav .back{font:500 13px/1 var(--mono);color:var(--navtx);text-decoration:none;margin-right:8px}.nav .back:hover{text-decoration:underline}.tiles{grid-template-columns:1fr;row-gap:.9cqw}.tiles .box{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-items:baseline;column-gap:1.5cqw;row-gap:.4cqw;min-height:0}.tiles .box>.lb:first-child{grid-column:1;grid-row:1}.tiles .big{grid-column:2;grid-row:1/3;white-space:nowrap;align-self:center}.tiles .box>.lb:last-child{grid-column:1;grid-row:2}</style><style>
@media (min-width:701px){
.slide.full{grid-template-columns:6% 88% 6%;grid-template-rows:auto auto;align-content:center;row-gap:2cqw}.slide.full .vis{padding:1.6cqw 2.2cqw}
.slide.full .txt{grid-column:2;grid-row:1}
.slide.full .vis{grid-column:2;grid-row:2}}
.pt th,.pt td{white-space:nowrap}
.pt td.p b{font-weight:500}.pt td.p a.pl{font-weight:500;color:var(--acc);text-decoration:none}.pt td.p a.pl:hover{text-decoration:underline}
.ok{color:var(--good)!important}.no{color:#D92D20!important}.run{color:var(--acc)!important}
.pt td.fin{font:600 1.3cqw/1 var(--sans);text-align:right}
.pt td{padding-top:.32cqw!important;padding-bottom:.32cqw!important}.pb{display:inline-block;width:4cqw;height:.7cqw;background:#fff;border:1px solid var(--fl2);border-radius:2px;margin-right:.8cqw;vertical-align:middle;position:relative;overflow:hidden}.pb i{position:absolute;inset:0 auto 0 0;background:currentColor}
.pt th:last-child{text-align:right}
.slide.full .vis{max-height:42cqw;overflow-y:auto;padding-top:0}
.pt th{position:sticky;top:0;background:var(--card);z-index:1;padding-top:1.6cqw!important;box-shadow:0 1px 0 var(--cardln)}
.pt{width:auto;margin:0 auto}.pt td.c,.pt th.c{text-align:center}.pt td.c.ok{font-size:1.1cqw!important}.pt .pb{width:2.6cqw;height:.6cqw;margin:0}
.pt td.p{max-width:18cqw;overflow:hidden;text-overflow:ellipsis}
.pt td.sc{letter-spacing:-.02em}.pt td.gr{font:600 1.15cqw/1 var(--sans);text-align:right}
.pt td.t{font-size:.8cqw!important;color:var(--mut);padding-right:.6cqw!important}
.pt th,.pt td{padding-right:.9cqw!important}
.pt th.srt{cursor:pointer;user-select:none}.pt th.srt.on{color:var(--ink)}
</style>
<script>
const S=[...document.querySelectorAll('.slide')];let cur=0;
function go(n){cur=Math.max(0,Math.min(S.length-1,n));S.forEach((s,i)=>s.classList.toggle('on',i===cur));
  document.getElementById('pg').textContent=`${cur+1} / ${S.length}`;prev.disabled=cur===0;next.disabled=cur===S.length-1;}
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});go(0);
</script>
<script>
// live table from status.json (GPU box, every 2 min) + scores.json + grades.json (hand-rated factors)
const DECK=['potassium','tma','putrescine','boar','nicotine','smoketest','magrec','reecoal','ammonium','psensor','chalco','gold','tmah','cesium','sulfur','phosphate','xenon','rareearth','plastic','cork','pfas','lithium','co2','ethylene','heatcold','formaldehyde','cement','rebar','dioxane','boron','siloxane','mousy','selenate','tfa','smoke'];
const TAG={"chalco": "Cemvita", "culoop": "Cemvita", "lignin": "Cemvita", "coolant": "Cemvita", "gout": "rheuma", "joint": "rheuma", "crp": "rheuma", "heatcold": "rheuma", "pdscav": "drug", "nitrite": "drug", "tfaswap": "drug", "chiral": "drug", "ironmedia": "biotech", "endotox": "biotech", "cryo": "biotech", "abcap": "biotech", "vaxstab": "biotech", "formaldehyde": "construction", "cement": "construction", "rebar": "construction", "dioxane": "water", "boron": "water", "selenate": "water", "tfa": "water", "pfas": "water", "phosphate": "water", "siloxane": "energy", "mousy": "wine", "smoke": "wine", "cork": "wine", "smoketest": "wine", "lithium": "batteries", "co2": "climate", "ethylene": "food", "rareearth": "rare earth", "magrec": "rare earth", "reecoal": "rare earth", "plastic": "plastic", "gold": "recycling", "tmah": "chips", "cesium": "nuclear", "sulfur": "fuel", "xenon": "gases", "ammonium": "sensors", "psensor": "sensors", "potassium": "health", "tma": "textiles", "putrescine": "food", "boar": "food", "nicotine": "health"};
const ST={done:['ok','done'],running:['run','running'],queued:['m','queued'],waiting:['m','waiting'],failed:['no','failed'],skipped:['m','skipped'],notrun:['m','not run']};
const FN=['Size','Competition','Novelty','Tech','Scores','Relevance','Sales cycle'];
let SC={},GR={},XR=[],D=null,SORT=null,DIR=-1;
function ph(v,stage){if(v==null)return '<td class="m c">—</td>';if(v===100)return '<td class="ok c">✓</td>';if(stage==='failed')return '<td class="no c">✗</td>';
  return `<td class="${v>0?'run':'m'} c" title="${stage||''}"><span class="pb"><i style="width:${v}%"></i></span></td>`}
function tmD(s){if(!s)return '';const d=new Date(s.replace('Z',':00Z'));return `${d.getMonth()+1}/${d.getDate()}`}
function tmF(s){if(!s)return '';const d=new Date(s.replace('Z',':00Z'));const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`}
function tm(s){if(!s)return '';const d=new Date(s.replace('Z',':00Z'));const z=n=>String(n).padStart(2,'0');return `${d.getMonth()+1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}`}
function ourScore(sc){if(!sc||sc.ours==null||sc.theirs==null)return null;return Math.max(0,Math.min(100,sc.ours+(sc.ours-sc.theirs)))}
function grade(k){const h=GR[k];if(!h)return null;const s=ourScore(SC[k]);const f=[h[0],h[1],h[2],h[3],s,h[4],h[5]];const v=f.filter(x=>x!=null);
  return {g:Math.round(v.reduce((a,b)=>a+b,0)/v.length),tip:f.map((x,i)=>`${FN[i]} ${x??'—'}`).join(' · ')}}
function scoreCell(sc){if(!sc)return '<td class="m">—</td>';const l1=sc.l1??(sc.l2==null?sc.ours:null),ours=[l1,sc.l2,sc.l3,sc.l4,sc.l5],mo=Math.max(...ours.map(v=>v??-1)),th=sc.theirs;
  const theirsWin=th!=null&&th>mo;const f=(v,us)=>v==null?'—':(us&&!theirsWin&&v===mo)?`<b class="ok">${v}</b>`:(!us&&theirsWin)?`<b class="no">${v}</b>`:v;
  return `<td class="sc">${[f(th,false),...ours.map(v=>f(v,true))].join('/')}</td>`}
const KEY={tag:r=>(TAG[r.key]||r.tag||'~').toLowerCase(),name:r=>r.name.toLowerCase(),grade:r=>grade(r.key)?.g??-1,created:r=>r.created||'',finished:r=>r.finished||''};
function sortBy(k){if(SORT===k)DIR=-DIR;else{SORT=k;DIR=k==='name'?1:-1}render(D)}
function th(label,k){return `<th class="srt${SORT===k?' on':''}" onclick="sortBy('${k}')">${label}${SORT===k?(DIR>0?' ↑':' ↓'):''}</th>`}
function render(d){if(!d)return;D=d;let R=[...d.rows];
  if(SORT){const f=KEY[SORT];R.sort((a,b)=>{const x=f(a),y=f(b);return (x<y?-1:x>y?1:0)*DIR})}
  const rows=R.map(r=>{const [c,t]=ST[r.state]||['m',r.state];const G=grade(r.key);
    const nm=r.href?`<a class="pl" href="${r.href}">${r.name}</a>`:DECK.includes(r.key)?`<a class="pl" href="${r.key==='heatcold'?'/decks/heatcold/':`/decks/opportunities/${r.key}/`}">${r.name}</a>`:`<b>${r.name}</b>`;
    return `<tr><td class="tg"><span>${TAG[r.key]||r.tag||'—'}</span></td><td class="p" title="${r.sub}">${nm}</td>${ph(r.phase1,r.phase1_stage)}${ph(r.phase2,r.phase2_stage)}${ph(r.phase3,r.phase3_stage)}${ph(r.phase4,r.phase4_stage)}${ph(r.phase5,r.phase5_stage)}${scoreCell(SC[r.key])}<td class="gr" title="${G?G.tip:''}">${G?G.g:'—'}</td><td class="t" title="${tmF(r.created)}">${tmD(r.created)}</td><td class="t" title="${tmF(r.finished)}">${tmD(r.finished)}</td><td class="fin ${c}">${t}</td></tr>`}).join('');
  document.getElementById('tbl').innerHTML=`<tr>${th('Tag','tag')}${th('Problem','name')}<th class="c">P1<br>design</th><th class="c">P2<br>L2</th><th class="c">P3<br>US</th><th class="c">P4<br>US, cheap</th><th class="c">P5<br>drop-in</th><th>Score<br>0/P1/2/3/4/5</th>${th('Grade','grade')}${th('Started','created')}${th('Finished','finished')}<th>Status</th></tr>${rows}`;
  const av=k=>{const v=R.map(r=>r[k]).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0};
  document.getElementById('ttl').textContent=`${R.length} spinoffs · Level 1: ${av('phase1')}% · Level 2: ${av('phase2')}% · Level 3: ${av('phase3')}% · Level 4: ${av('phase4')}% · Level 5: ${av('phase5')}%`;
}
function load(){const J=u=>fetch(u,{cache:'no-store'}).then(r=>r.json()).catch(()=>({}));
  Promise.all([J('scores.json'),J('grades.json'),J('../bioprogress/scores.json'),J('../bioprogress/status.json'),J('status.json')]).then(([s,g,bs,bst,d])=>{
    SC={...s,...bs};GR=g.rows||{};XR=g.extra_rows||[];if(!d.rows)return;
    const bio=(bst.rows||[]).map(r=>({...r,href:`/decks/bio/${r.key}/`}));
    d.rows=d.rows.concat(bio,XR).filter((r,i,a)=>a.findIndex(x=>x.key===r.key)===i);render(d)});}
load();setInterval(load,60000);
</script>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Decks page layouts · K14</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#14161A;--body:#2A2F3A;--mut:#596070;--line:#C6CCD5;--soft:#EDEFF2;--page:#FAF9F5;--green:#2E8A1F;--hov:#F1F6EC;
 --sans:"Geist",ui-sans-serif,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;
 --deck:#14161A;--dash:#2E8A1F;--table:#0057FF;--gallery:#7A3FFF;--form:#C2410C;--site:#596070}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.w{padding:36px 40px 56px;max-width:1320px}h1{margin:0 0 26px;font:600 28px/1 var(--sans);letter-spacing:-.03em}
a{color:inherit;text-decoration:none}
.bx{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bx h2{margin:0;padding:11px 14px;font:600 14.5px/1 var(--sans);letter-spacing:-.01em;border-bottom:1px solid var(--soft);display:flex;justify-content:space-between;align-items:baseline}
.bx h2 small{font:400 11px/1 var(--mono);color:var(--mut)}
.it{display:flex;align-items:center;gap:9px;padding:8px 14px;border-bottom:1px solid var(--soft);font-size:13.5px}.it:last-child{border-bottom:0}.it:hover{background:var(--hov)}
.it b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it em{font:400 11px/1 var(--mono);font-style:normal;color:var(--mut);white-space:nowrap}
/* type marks */
.tk{flex:none;width:18px;height:14px;border-radius:3px;position:relative;border:1.5px solid var(--c)}
.tk.deck{--c:var(--deck)}.tk.deck::after{content:"";position:absolute;left:3px;right:3px;bottom:2px;height:2px;background:var(--c)}
.tk.dash{--c:var(--dash);background:linear-gradient(to top,var(--c) 0 40%,transparent 40%) 3px 100%/3px 100% no-repeat,linear-gradient(to top,var(--c) 0 75%,transparent 75%) 8px 100%/3px 100% no-repeat}
.tk.table{--c:var(--table);background:repeating-linear-gradient(to bottom,transparent 0 3px,var(--c) 3px 4px)}
.tk.gallery{--c:var(--gallery);background:conic-gradient(var(--c) 25%,transparent 0 50%,var(--c) 0 75%,transparent 0) 0 0/8px 6px}
.tk.form{--c:var(--form)}.tk.form::after{content:"";position:absolute;left:3px;right:6px;top:4px;height:1.5px;background:var(--c);box-shadow:0 3px 0 var(--c)}
.tk.site{--c:var(--site);border-radius:50%;width:14px}
.chip{font:500 10.5px/1 var(--mono);padding:4px 7px;border-radius:4px;color:#fff;background:var(--c);flex:none}
.chip.deck{--c:var(--deck)}.chip.dash{--c:var(--dash)}.chip.table{--c:var(--table)}.chip.gallery{--c:var(--gallery)}.chip.form{--c:var(--form)}.chip.site{--c:var(--site)}
.scr{max-height:262px;overflow:auto}
.lbl{font:500 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
/* 1 by type */
.v1{display:flex;flex-direction:column;gap:30px}.v1 .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:start}
.v1 .rep{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}.rc:hover{border-color:var(--ink)}
.rc b{font:600 17px/1.15 var(--sans);letter-spacing:-.02em}.rc em{font:400 12px/1 var(--mono);font-style:normal;color:var(--mut)}
.rc .hd{display:flex;justify-content:space-between;align-items:center;gap:6px}.rc .hd em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 2 by purpose */
.v2{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}.v2 .col{display:flex;flex-direction:column;gap:10px}
.v2 .head{padding:4px 2px 4px}.v2 .head b{display:block;font:600 19px/1.1 var(--sans);letter-spacing:-.02em}.v2 .head span{font:400 12.5px/1.3 var(--sans);color:var(--mut)}
/* 3 launcher */
.v3 .sb{display:flex;gap:8px;align-items:center;margin-bottom:18px}.v3 input{flex:1;max-width:560px;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:400 15px var(--sans);background:#fff}
.v3 .flt{display:flex;gap:6px;margin-bottom:22px}.v3 .flt button{all:unset;cursor:pointer;font:500 12px/1 var(--mono);padding:8px 11px;border-radius:6px;border:1px solid var(--line);background:#fff;display:flex;gap:7px;align-items:center}.v3 .flt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.v3 .pins{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:26px}
.v3 .az{columns:3;column-gap:28px}.v3 .az .it{break-inside:avoid;border-bottom:1px solid var(--soft);padding:7px 2px}
/* 4 two-pane */
.v4{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.v4 nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:16px}.v4 nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;padding:9px 12px;border-radius:7px;font:500 14px/1 var(--sans)}
.v4 nav button em{font:400 11px/1 var(--mono);font-style:normal;color:var(--mut)}.v4 nav button.on{background:var(--ink);color:#fff}.v4 nav button.on em{color:#C9CED8}.v4 nav button:hover:not(.on){background:var(--soft)}
.v4 .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.v4 .cards .rc{min-height:110px}
/* 5 pipeline */
.v5 .pipe{display:grid;grid-template-columns:1fr 1.3fr 1fr .7fr 1fr;gap:0;align-items:start;margin-bottom:28px}
.v5 .st{display:flex;flex-direction:column;gap:10px;padding:0 10px;position:relative;min-width:0}
.v5 .st .sh{display:flex;align-items:center;gap:8px;font:600 15px/1 var(--sans);padding:0 2px 6px}
.v5 .st .sh i{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font:500 11px/22px var(--mono);text-align:center;font-style:normal}
.v5 .st:not(:last-child)::after{content:"→";position:absolute;right:-7px;top:2px;color:var(--mut);font:500 14px/1 var(--mono)}
.v5 .st .none{font:400 12.5px/1.3 var(--sans);color:var(--mut);padding:10px 14px;border:1px dashed var(--line);border-radius:12px}
.v5 .rep{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
</style></head><body><div class="w"><h1>Decks</h1><div id="out"></div></div>

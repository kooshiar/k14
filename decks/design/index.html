<style>
  /* Design ideas for the site. Each concept opens with a separator page, then one option per page. */
  html, body{height:100%}
  body{overflow:hidden}
  /* the hero exactly as on the homepage (same grid, title and stage), then the cream page below it */
  .hero{background:var(--bg); color:var(--txt); overflow:hidden}
  .hero .top{display:grid; grid-template-columns:1.15fr .85fr; align-items:center; gap:40px; padding-top:8px; padding-bottom:4px; position:relative; overflow:hidden}
  h1{margin:0; font-weight:500; font-size:clamp(38px, 4vw, 56px); line-height:1.02; letter-spacing:-.035em}
  .hstage{position:relative; height:256px}
  #gl{position:absolute; inset:-36px -60px; cursor:grab} #gl:active{cursor:grabbing} #gl canvas{display:block; width:100%; height:100%}
  [hidden]{display:none !important}
  /* separator page: the concept name alone */
  .sep{position:fixed; inset:0 0 64px; display:grid; place-items:center; font-weight:500; font-size:clamp(32px, 4vw, 52px); letter-spacing:-.03em; color:var(--ink)}
  /* apps under the hero. Colour pages: 10 tiles in one row. Tile pages: the homepage row (size and rows vary) */
  .apps{padding-block:26px 0}
  .apps h2{margin:0 0 12px; font-weight:500; font-size:24px; letter-spacing:-.02em}
  .row10{display:grid; grid-template-columns:repeat(10, minmax(0, 1fr)); gap:14px}
  .row10 canvas{display:block; width:100%; aspect-ratio:1; border-radius:18px; background:var(--bg)}
  .row10 b{display:block; margin-top:7px; font-weight:500; font-size:12px; line-height:1.25; letter-spacing:-.005em; color:var(--ink)}
  .rowbox{position:relative; width:fit-content; max-width:100%}   /* More sits on the last tile of the first row */
  .more{position:absolute; right:8px; top:8px; z-index:2; padding:6px 12px; border-radius:99px; background:var(--ink); box-shadow:0 0 0 1.5px var(--page); color:#fff;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; text-decoration:none}
  .rowh{display:grid; grid-auto-flow:column; grid-auto-columns:var(--t); gap:20px; overflow:hidden; padding-top:2px}
  .rowh.two{grid-template-rows:repeat(2, auto); row-gap:18px}
  .rowh .card{display:block; color:var(--ink); text-decoration:none}
  .rowh canvas{display:block; width:var(--t); height:var(--t); border-radius:calc(var(--t) * .23); background:var(--bg)}
  .rowh .card div{padding:9px 2px 0}
  .rowh b{display:block; font-weight:500; font-size:13.5px; line-height:1.25; letter-spacing:-.005em}
  .rowh small{display:block; margin-top:3px; font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--mute)}
  /* app page mockups (one sample app, five layouts) */
  .mock{position:fixed; inset:0 0 64px; overflow:auto; padding-block:28px 40px}
  .mock h1{margin:6px 0 12px; font-weight:500; font-size:clamp(26px, 2.6vw, 34px); line-height:1.1; letter-spacing:-.025em; color:var(--ink)}
  .mock h3{margin:0 0 8px; font-family:var(--mono); font-weight:500; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute)}
  .mock h4{margin:14px 0 6px; font-weight:500; font-size:13px; color:var(--ink)}
  .mock p{margin:0; font-size:15px; line-height:1.5; color:var(--ink2)} .mock p b{color:var(--ink); font-weight:500}
  .crumb{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute)}
  .lvs{display:flex; gap:8px; flex-wrap:wrap}
  .lv{font-size:12.5px; font-weight:500; padding:5px 11px; border-radius:99px; border:1.5px solid var(--ink); color:var(--ink)}
  .tile{margin:0} .tile canvas{display:block; width:100%; aspect-ratio:1; border-radius:22%; background:var(--bg)}
  .trk{list-style:none; margin:4px 0 14px; padding:0; display:grid; grid-template-columns:repeat(5, 1fr); position:relative}
  .trk li{display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center; position:relative; font-size:11.5px; color:var(--mute)}
  .trk li::before{content:""; position:absolute; top:6px; left:-50%; width:100%; height:2px; background:var(--rule); z-index:0} .trk li:first-child::before{display:none}
  .trk li.done::before, .trk li.now::before{background:var(--blue)}
  .trk i{width:14px; height:14px; border-radius:99px; background:var(--page); border:2px solid var(--rule); z-index:1}
  .trk li.done i{background:var(--blue); border-color:var(--blue)} .trk li.now i{border-color:var(--blue); box-shadow:0 0 0 4px rgba(63,127,44,.18)}
  .trk li.done span, .trk li.now span{color:var(--ink)}
  .sc{display:flex; flex-direction:column; gap:7px; margin:6px 0 4px}
  .sc div{display:grid; grid-template-columns:90px 1fr 34px; align-items:center; gap:10px; font-size:13px; color:var(--ink)}
  .sc b{height:10px; border-radius:99px; background:linear-gradient(90deg, var(--blue) var(--w), var(--rule) var(--w))} .sc .t b{background:linear-gradient(90deg, #9AA3B2 var(--w), var(--rule) var(--w))}
  .sc em{font-style:normal; font-weight:600; text-align:right} .sc .t em{color:var(--mute); font-weight:500}
  .wins{list-style:none; margin:0; padding:0} .wins li{display:flex; justify-content:space-between; gap:12px; min-width:0; padding:7px 0; border-top:1px solid var(--rule); font-size:13.5px; color:var(--ink)}
  .wins li span{flex:1; min-width:0} .wins em{font-style:normal; font-family:var(--mono); font-size:12.5px; color:var(--blue); white-space:nowrap}
  .cta{display:flex; justify-content:space-between; align-items:center; margin-top:24px; padding:20px 24px; border-radius:14px; background:var(--blue); color:#fff;
    font-weight:500; font-size:19px; letter-spacing:-.01em; text-decoration:none} .cta span{font-size:22px} .cta:hover{background:#2F6A20}
  .v1{display:grid; grid-template-columns:minmax(0, 1.2fr) minmax(0, .8fr); gap:56px; align-items:start}
  .v1 .why{margin:18px 0 22px} .v1 h3{margin-top:22px} .v1 dl{display:grid; grid-template-columns:90px 1fr; gap:6px 12px; margin:0; font-size:14px} .v1 dt{color:var(--mute)} .v1 dd{margin:0; color:var(--ink)}
  .v1 .side{position:sticky; top:0}
  .v2{margin-top:-28px} .v2 .band{background:var(--bg); color:var(--txt); padding-block:28px 32px}
  .v2 .bin{display:grid; grid-template-columns:1fr 260px; gap:48px; align-items:center} .v2 h1{color:var(--txt)} .v2 .crumb{color:var(--dim)}
  .v2 .lv{border-color:rgba(236,237,238,.5); color:var(--txt)} .v2 .why{margin-top:16px; color:var(--txt2); font-size:17px}
  .v2 .tile canvas{border-radius:0; background:none}
  .v2 .cols{display:grid; grid-template-columns:repeat(3, 1fr); gap:36px; padding-top:32px} .v2 .cols p{font-size:14px}
  .v2 .big, .v5 .big{display:flex; align-items:baseline; gap:10px; margin-top:4px} .v2 .big b, .v5 .big b{font-size:44px; font-weight:600; letter-spacing:-.03em; color:var(--blue)} .v2 .big span, .v5 .big span{font-size:13px; color:var(--mute)}
  .wint{display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-top:28px}
  .wint div{border:1px solid var(--rule); border-radius:12px; padding:16px 18px; background:#fff; display:flex; flex-direction:column; gap:2px}
  .wint b{font-size:30px; font-weight:600; letter-spacing:-.03em; color:var(--blue)} .wint span{font-size:13px; font-weight:500; color:var(--ink)} .wint em{font-style:normal; font-size:12px; color:var(--mute); margin-top:4px}
  .v3 .head{display:flex; gap:20px; align-items:center} .v3 .head .tile{width:110px; flex:none}
  .v3 .board{display:grid; grid-template-columns:auto auto auto 1fr; align-items:end; gap:22px; margin-top:26px; padding:22px 26px; border-radius:16px; background:#fff; border:1px solid var(--rule)}
  .v3 .board b{display:block; font-size:72px; font-weight:600; line-height:.9; letter-spacing:-.04em} .v3 .us b{color:var(--blue)} .v3 .them b{color:#9AA3B2}
  .v3 .board span{font-size:13px; color:var(--mute)} .v3 .vs{font-size:18px; color:var(--mute); padding-bottom:22px} .v3 .board p{justify-self:end; text-align:right; font-size:13px; max-width:200px}
  .v3 .rows{display:grid; grid-template-columns:90px 1fr; gap:12px 20px; margin:26px 0 0; font-size:14px} .v3 dt{color:var(--mute); font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding-top:3px} .v3 dd{margin:0; color:var(--ink2)} .v3 dd b{color:var(--ink); font-weight:500}
  .v4 .head{display:flex; justify-content:space-between; gap:28px; align-items:center} .v4 .head .tile{width:150px; flex:none}
  .v4 .story{list-style:none; margin:26px 0 0; padding:0}
  .v4 .story > li{display:grid; grid-template-columns:44px 110px 1fr; gap:16px; padding:18px 0; border-top:1px solid var(--rule); align-items:start}
  .v4 .story > li > *{min-width:0}
  .v4 .story i{font-style:normal; font-family:var(--mono); font-size:13px; color:var(--blue); padding-top:2px} .v4 .story h3{margin:2px 0 0}
  .v4 .next .cta{margin-top:14px}
  .v5 .bento{display:grid; grid-template-columns:repeat(3, 1fr); gap:14px}
  .v5 .b{background:#fff; border:1px solid var(--rule); border-radius:16px; padding:18px 20px; display:flex; flex-direction:column; gap:8px}
  .v5 .ttl{grid-column:1 / 3} .v5 .mol{grid-row:1 / 3; grid-column:3; padding:0; overflow:hidden; background:var(--bg); border:0} .v5 .mol .tile canvas{border-radius:0}
  .v5 .b p{font-size:14px}
  .v5 .go{grid-column:1 / -1; flex-direction:row; justify-content:space-between; align-items:center; background:var(--bg); border:0; color:var(--txt); text-decoration:none; font-size:22px; font-weight:500; padding:24px 28px}
  .v5 .go b{font-size:28px; color:var(--sky)} .v5 .go:hover{background:#000}
  /* page 1 gallery: 4 columns, newest concept first */
  .gal{position:fixed; inset:0 0 64px; overflow:auto; padding:28px 0}
  .gg{max-width:1200px; margin:0 auto; padding:0 28px; display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:18px}
  .gi{display:flex; flex-direction:column; gap:10px; color:var(--ink); text-decoration:none}
  .gi b{font-weight:500; font-size:15px; letter-spacing:-.01em} .gi:hover b{color:var(--blue)}
  .pic{aspect-ratio:4 / 3; border-radius:16px; overflow:hidden; position:relative; background:var(--bg); border:1px solid var(--rule); transition:transform .2s}
  .gi:hover .pic{transform:translateY(-3px)}
  .pic.page{background:var(--page)} .pic.page .shrink{position:absolute; left:0; top:0; width:1100px; transform:scale(var(--k, .24)); transform-origin:0 0; pointer-events:none}
  .pic.page .shrink .wrap{padding:0 22px}
  .pic.tiles{display:flex; align-items:flex-end; justify-content:center; gap:10%; padding:0 8% 20%}
  .pic.tiles i{width:calc(var(--z) / 104 * 26%); aspect-ratio:1; border-radius:22%; background:#22252B; border:1px solid rgba(236,237,238,.12); overflow:hidden}
  .pic.tiles canvas, .pic.colors canvas{display:block; width:100%; height:100%}
  .pic.solved{display:grid; grid-template-columns:repeat(4, 1fr); gap:6%; align-items:center; padding:0 7%; background:var(--page)}
  .pic.solved .tw{aspect-ratio:1; border-radius:22%; background:#22252B; overflow:hidden; display:block} .pic.solved canvas{display:block; width:100%; height:100%}
  .pic.solved .tw.d{outline:2px solid #6FAF52; outline-offset:3px; overflow:visible} .pic.solved .tw.d canvas{border-radius:22%} .pic.solved .tw.o{opacity:.4; filter:grayscale(1)}
  .pic.prog{display:grid; grid-template-columns:repeat(3, 1fr); gap:8%; align-items:center; padding:0 8%}
  .pic.prog .tw{aspect-ratio:1; border-radius:22%; background:#22252B; overflow:hidden} .pic.prog canvas{display:block; width:100%; height:100%}
  .pic.colors{display:grid; grid-template-columns:repeat(5, 1fr); align-items:center; padding:0 4%}
  .pic.colors canvas{aspect-ratio:1; height:auto}
  .pic.dcol{background:#EFEDE8; display:grid; grid-template-columns:repeat(3, 1fr); gap:6%; padding:9% 8%}
  .pic.dcol .sw{border-radius:6px; padding:9%; display:flex; align-items:center} .pic.dcol .sw span{display:flex; flex-direction:column; gap:7px; width:100%; padding:12%; border-radius:3px; box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .pic.dcol .sw em{width:46%; height:8px; border-radius:99px} .pic.dcol .sw b{width:80%; height:5px; border-radius:3px; background:#181818} .pic.dcol .sw u{width:34%; height:7px; border-radius:2px}
  .pic.ptab{background:#FAF9F5; display:flex; flex-direction:column; justify-content:center; gap:7%; padding:0 9%}
  .pic.ptab .hd{height:0; border-top:1.5px solid #181818} .pic.ptab .rw{display:flex; align-items:center; gap:5%}
  .pic.ptab .rw em{width:16%; height:9px; border-radius:3px; background:#14161A} .pic.ptab .rw b{width:30%; height:6px; border-radius:3px; background:#181818}
  .pic.ptab .rw u{width:8%; height:7px; border-radius:2px; background:#3F7F2C} .pic.ptab .rw s{display:flex; gap:4px; width:22%} .pic.ptab .rw s i{flex:1; height:6px; border-radius:2px; background:#D5D8DD}
  .pic.ptab .rw s i.d{background:#3F7F2C} .pic.ptab .rw s i.r{background:#8A6CFF} .pic.ptab .rw s i.x{background:#D9604E}
  .pic.icol{display:grid; grid-template-columns:repeat(3, 1fr); gap:6%; align-content:center; padding:0 9%}
  .pic.icol i{aspect-ratio:1; border-radius:22%; background:#22252B; border:1px solid rgba(236,237,238,.12); overflow:hidden} .pic.icol canvas{display:block; width:100%; height:100%}
  .pic.rcard{background:#E6E3DC; display:grid; grid-template-columns:repeat(2, 1fr); gap:6%; padding:9% 9%} .pic.rcard div{background:#fff; border:1px solid #C6CCD5; border-radius:4px; padding:9%; display:flex; flex-direction:column; gap:7px} .pic.rcard em{width:38%; height:7px; border-radius:99px; background:#E6E9EE} .pic.rcard b{width:85%; height:7px; border-radius:3px; background:#181818} .pic.rcard i{width:60%; height:5px; border-radius:3px; background:#8A909B} .pic.rcard u{width:30%; height:8px; border-radius:2px; background:#2E8A1F}
  .pic.dkl{background:#FAF9F5; display:grid; grid-template-columns:repeat(4, 1fr); gap:5%; padding:12% 8%; align-items:start} .pic.dkl div{background:#fff; border:1px solid #C6CCD5; border-radius:4px; padding:10%; display:flex; flex-direction:column; gap:6px} .pic.dkl b{height:7px; width:70%; border-radius:3px; background:#181818} .pic.dkl i{height:5px; border-radius:3px; background:#C6CCD5} .pic.dkl div:first-child i{background:#2E8A1F}
  .pic.dkh{background:#FAF9F5; display:grid; grid-template-columns:repeat(8, 1fr); gap:3%; padding:30% 6%; align-content:start} .pic.dkh i{aspect-ratio:1; border-radius:18%; background:#fff; border:1px solid #C6CCD5}
  .pic.hero .gl{position:absolute; inset:-8% -4%} .pic.hero .gl canvas{display:block; width:100%; height:100%}
  @media (max-width:900px){ .gg{grid-template-columns:1fr 1fr} }
  /* one fold: the whole page fits the screen under the top bar, button included */
  .mock.fit{padding-block:18px}
  .fold{display:grid; gap:12px; align-content:start}
  .fold .b{background:#fff; border:1px solid var(--rule); border-radius:16px; padding:16px 18px; display:flex; flex-direction:column; gap:6px}
  .fold h1{margin:4px 0 10px; font-size:clamp(24px, 2.4vw, 32px)} .fold p{font-size:14px; line-height:1.45}
  .fold .mol{padding:0; overflow:hidden; background:var(--bg); border:0; min-height:220px; position:relative} .fold .mol .tile{position:absolute; inset:0} .fold .mol .tile canvas{width:100%; height:100%; aspect-ratio:auto; border-radius:0}
  .f8 .rc .mol{aspect-ratio:1}
  .fold .trk{margin:6px 0 4px} .fold .prog .btn{margin-top:12px}
  .nums{display:grid; grid-template-columns:repeat(4, 1fr); flex:1}

  .nums b{font-size:34px; font-weight:600; letter-spacing:-.03em; line-height:1.05; color:var(--blue)} .nums b small{font-size:18px; font-weight:500; color:var(--mute)}

  .f6{grid-template-columns:1fr 1fr 1fr}
  .f6 .ttl{grid-column:1 / 3} .f6 .mol{grid-column:3; grid-row:1 / 3} .f6 .sol{grid-column:1 / 3}
  .f7{grid-template-columns:1fr 1fr 1fr}
  .f7 .ttl{grid-column:1 / -1; flex-direction:row; justify-content:space-between; align-items:center} .f7 .ttl .btn{align-self:center}
  .f7 .sol{grid-column:1 / -1} .f7 .sh{display:flex; justify-content:space-between; align-items:flex-start; gap:24px} .f7 .sh .trk{width:420px; margin:0}
  .f8{grid-template-columns:1.6fr 1fr}
  .f8 .lc, .f8 .rc{display:grid; gap:12px; min-height:0} .f8 .lc, .f8 .rc{align-content:start}
  .f8 .two{display:grid; grid-template-columns:1fr 1fr; gap:12px} .f8 .nums{grid-template-columns:1fr 1fr; row-gap:14px} .f8 .nums > div:nth-child(3){border-left:0; padding-left:0}
  .f8 .rc .btn{justify-self:start}
  @media (max-width:900px){ .mock.fit .fold{height:auto; grid-template-columns:1fr} .fold > *{grid-column:auto !important; grid-row:auto !important} .nums{grid-template-columns:1fr 1fr} .f8 .two{grid-template-columns:1fr} .fold .mol{height:260px} }
  @media (max-width:900px){ .v1, .v2 .bin, .v2 .cols, .wint, .v5 .bento{grid-template-columns:1fr} .v5 .ttl, .v5 .mol{grid-column:auto; grid-row:auto} .v3 .board{grid-template-columns:auto auto auto} .v3 .board p{display:none} .v4 .story > li{grid-template-columns:36px 1fr} .v4 .story > li > div, .v4 .story > li > p{grid-column:2} }
  /* designed vs open apps (st >= 2 = design runs done). Strong, not loud: one green, the rest muted */
  .rowh[class*=hl-] .card.o b{color:var(--ink2)} .rowh[class*=hl-]{padding:5px; margin:-5px}
  .hl-ring .card.d canvas{outline:2px solid #6FAF52; outline-offset:3px} .hl-ring .card.o canvas{filter:grayscale(1); opacity:.45}
  .gw{color:#3F7F2C !important; font-weight:600}
  .hl-split .card.d{position:relative} .hl-split .card.o canvas{filter:grayscale(1) invert(1); opacity:.32; outline:1.5px dashed #9AA3B2; outline-offset:-1.5px}
  .hl-light .card.o canvas{filter:grayscale(1) invert(1) brightness(1.04); opacity:.85} .hl-light .card.d canvas{box-shadow:0 0 0 1.5px #6FAF52}
  .hl-check .tw{position:relative; display:block} .hl-check .ck{position:absolute; top:6px; right:6px; width:18px; height:18px; border-radius:99px; display:grid; place-items:center;
    font-style:normal; font-size:11px; font-weight:700; line-height:1} .hl-check .card.d .ck{background:#8FCB72; color:#14200F} .hl-check .card.o .ck{border:1.5px solid rgba(236,237,238,.35); box-sizing:border-box}

  .hl-label .lbl{display:inline-block; margin-top:4px; font-style:normal; font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase}

  /* progress marks on app tiles: steps done = researched (1), designed (2), beats today's best (3) of 5 */
  .tw{position:relative; display:block}
  .pill{position:absolute; left:6px; top:6px; font-style:normal; font-family:var(--mono); font-size:8.5px; letter-spacing:.04em; text-transform:uppercase;

<style>
:root{--ink:#14161A;--body:#2A2F3A;--mut:#596070;--line:#C6CCD5;--soft:#EDEFF2;--page:#FAF9F5;--hov:#F1F6EC;--wire:#B9C0CA;
 --sans:"Geist",ui-sans-serif,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit}
.w{max-width:1040px;margin:0 auto;padding:22px 40px 64px}
.top{display:flex;justify-content:flex-end;margin-bottom:16px;position:relative}
.top input{width:200px;height:30px;border:1px solid var(--line);border-radius:7px;padding:0 10px;font:400 13px var(--sans);background:#fff}
.res{position:absolute;right:0;top:36px;width:300px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.1);z-index:5;max-height:340px;overflow:auto}
/* tiles: style A, smaller */
.row{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;margin-bottom:64px}
.tl{position:relative;aspect-ratio:1;border-radius:12px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden;background:#fff;border:1px solid var(--line)}
.tl b{font:600 12.5px/1.15 var(--sans);letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl svg{width:34px;height:34px}
.pin1{background:var(--c);color:#fff;border:0}
.tl .x{all:unset;position:absolute;top:6px;right:8px;cursor:pointer;font:500 12px/1 var(--mono);opacity:0}.tl:hover .x{opacity:.6}
.tl.add{border-style:dashed;align-items:center;justify-content:center;color:var(--mut);background:transparent;font:400 22px/1 var(--sans)}
.inf{background:#14161A;color:#fff;border:0}.inf .hd{font:500 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#9AA0AA}
.nums{display:flex;flex-direction:column;gap:6px}.nums div{display:flex;align-items:baseline;gap:6px}.nums b{font:600 19px/1 var(--sans);letter-spacing:-.03em}.nums span{font:400 10.5px/1.1 var(--sans);color:#9AA0AA}
.al b{color:#FF8A65}.nw b{color:#6CCB4E}.vs b{color:#8AB4FF}
.tk{flex:none;width:18px;height:14px;border-radius:3px;position:relative;border:1.5px solid var(--c);display:inline-block}
.tk.deck{--c:#14161A}.tk.deck::after{content:"";position:absolute;left:3px;right:3px;bottom:2px;height:2px;background:var(--c)}

.tk.table{--c:#0057FF;background:repeating-linear-gradient(to bottom,transparent 0 3px,var(--c) 3px 4px)}
.tk.gallery{--c:#7A3FFF;background:conic-gradient(var(--c) 25%,transparent 0 50%,var(--c) 0 75%,transparent 0) 0 0/8px 6px}
.tk.form{--c:#C2410C}.tk.form::after{content:"";position:absolute;left:3px;right:6px;top:4px;height:1.5px;background:var(--c);box-shadow:0 3px 0 var(--c)}

.bx{position:relative;z-index:1;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bx h2{margin:0;padding:12px 14px 10px;font:600 16px/1 var(--sans);letter-spacing:-.02em;color:var(--ink)}
.it{display:flex;align-items:center;gap:9px;padding:7px 14px;font-size:13.5px;border-top:1px solid var(--soft)}.it:hover{background:var(--hov)}

.bx.empty{min-height:74px}.fold summary{list-style:none;cursor:pointer}.fold summary::-webkit-details-marker{display:none}.fold h2{display:flex;justify-content:space-between;padding-bottom:12px!important}.fold h2::after{content:'+';font:400 15px/1 var(--mono);color:var(--mut)}.fold[open] h2::after{content:'−'}.fold:not([open]){background:transparent}.bx.one .it{border-top:0;padding:12px 14px;font-weight:500}.bx.one .it b{font-weight:500}.bx.sm .it{font-size:12.5px;padding:6px 14px}.bx.sm h2{font-size:14.5px}
/* 1 four columns, order runs down each column */
.v1 .map{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 34px;align-items:start}.v1 .col{display:flex;flex-direction:column;gap:22px}
/* 2 snake: row 1 left to right, row 2 right to left */
.v2 .map{display:grid;grid-template-columns:repeat(4,1fr);gap:44px 34px;align-items:start}
/* 3 one line, narrow boxes */
.v3 .map{display:grid;grid-template-columns:repeat(7,1fr);gap:18px;align-items:start}.v3 .col{display:flex;flex-direction:column;gap:18px}.v3 .bx h2{font-size:14px}.v3 .it{padding:6px 10px;font-size:12.5px}.v3 .it .tk{display:none}.v3 .bx h2{padding:11px 10px 9px}.v3 .mo{padding:6px 10px}

.v5 .bx{border:0;background:transparent;border-radius:0;overflow:visible}.v5 .bx h2{padding:0 0 8px;font-size:17px;border-bottom:2px solid var(--ink)}.v5 .it{padding:7px 0;border-top:0}.v5 .it .tk{display:none}.v5 .mo{padding:7px 0;border-top:0}
.v5 .bx h2,.v5 .it,.v5 .mo{background:var(--page)}
/* 6 white cards, no borders, soft shadow; straight line only inside a column */
.v6 .map,.v7 .map,.v8 .map{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 34px;align-items:start}.v6 .col,.v7 .col,.v8 .col{display:flex;flex-direction:column;gap:26px}
.v6 .tl:not(.pin1):not(.inf),.v7 .tl:not(.pin1):not(.inf),.v8 .tl:not(.pin1):not(.inf){border:0;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05)}
.v6 .tl.add,.v7 .tl.add,.v8 .tl.add{box-shadow:none!important;border:1.5px dashed #D5D9E0!important}
.v6 .bx{border:0;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05)}.v6 .it,.v6 .mo{border-top:0}.v6 .bx h2{padding-bottom:6px}.v6 .bx>:last-child{margin-bottom:6px}
/* 7 no cards, no lines: strong title, links under it */
.v7 .bx{border:0;background:transparent;border-radius:0;overflow:visible}.v7 .bx h2{padding:0 0 10px;font-size:17px}.v7 .it,.v7 .mo{border-top:0;padding:6px 0}.v7 .it:hover{background:transparent}.v7 .it:hover b{text-decoration:underline}
/* 8 cards with a dark top edge, one straight line across the column tops */
.v8 .map{padding-top:26px}.v8 .bx{border:0;border-top:3px solid var(--ink);border-radius:4px 4px 12px 12px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05)}.v8 .it,.v8 .mo{border-top:0}.v8 .bx>:last-child{margin-bottom:6px}

const recT=x=>`<a class="tl" href="${x.u}"><span class="tk ${x.k}"></span><b>${esc(x.t)}</b></a>`;
const infT=(c,h,rows)=>`<a class="tl inf ${c}"${c==='vs'?' href="/decks/visits"':''}><span class="hd">${h}</span><div class="nums">${rows.map(([v,l])=>`<div><b>${v}</b><span>${esc(l)}</span></div>`).join('')}</div></a>`;
const it=x=>`<a class="it" href="${x.u}"><span class="tk ${x.k}"></span><b>${esc(x.t)}</b><button class="pin" data-pin="${x.u}" title="Pin">☆</button></a>`;
// column 4: one title row each, click opens the full box
const fold=g=>{const xs=G(g);return `<details class="bx fold" id="b-${g}"><summary><h2>${NAME[g]}</h2></summary>${xs.map(it).join('')}</details>`};
function box(g){const xs=G(g),id='m'+g,max=g==='pdecks'?4:5,k=xs.length>max?max-1:xs.length,show=xs.slice(0,k);if(!xs.length&&g!=='programs')return '';
 return `<section class="bx${xs.length?'':' empty'}${xs.length===1?' one':''}${g==='pdecks'||g==='z'?' sm':''}" id="b-${g}">${xs.length===1?'':`<h2>${NAME[g]}</h2>`}${show.map(it).join('')}${xs.length>max?`<div id="${id}" hidden>${xs.slice(k).map(it).join('')}</div><button class="mo" data-m="${id}">+${xs.length-k}</button>`:''}</section>`}
function layout(){const c=a=>`<div class="col">${a.map(box).join('')}</div>`;
 if(V==='1')return c(['eng','styles','dash'])+c(['problems','programs'])+c(['pitches','partners'])+`<div class="col">${['pdecks','comms','z'].map(fold).join('')}</div>`;   // decks page, 2026-10-27
 if(['5','6','7','8'].includes(V))return c(['problems','pdecks'])+c(['eng','styles'])+c(['programs','partners'])+c(['pitches','comms']);
 if(V==='2')return ['problems','eng','styles','programs','pdecks','comms','pitches','partners'].map(box).join('');
 if(V==='3')return c(['problems','pdecks'])+['eng','styles','programs','partners','pitches','comms'].map(g=>c([g])).join('');
 return ['problems','pdecks','eng','styles','programs','partners','pitches','comms'].map(box).join('')}
function wires(){const m=$('map'),svg=$('wires');if(!m||!svg)return;if(window.NOWIRE){svg.innerHTML='';return}if(V==='7'){svg.innerHTML='';return}
 if(V==='6'||V==='8'){const R=m.getBoundingClientRect();let h='';
  if(V==='6')document.querySelectorAll('#map .col').forEach(c=>{const b=[...c.querySelectorAll('.bx')].map(e=>e.getBoundingClientRect());for(let i=0;i+1<b.length;i++){const x=b[i].left-R.left+22;h+=`<line x1="${x}" y1="${b[i].bottom-R.top}" x2="${x}" y2="${b[i+1].top-R.top}" stroke="#14161A" stroke-width="1.5"/>`}});
  if(V==='8'){const cs=[...document.querySelectorAll('#map .col')].map(c=>c.getBoundingClientRect());const y=6;h+=`<line x1="${cs[0].left-R.left+14}" y1="${y}" x2="${cs[cs.length-1].left-R.left+14}" y2="${y}" stroke="#14161A" stroke-width="1.5"/>`+cs.map(c=>`<circle cx="${c.left-R.left+14}" cy="${y}" r="4" fill="#14161A"/>`).join('')}
  svg.innerHTML=h;return}const R=m.getBoundingClientRect(),r=g=>{const e=$('b-'+g).getBoundingClientRect();return{l:e.left-R.left,r:e.right-R.left,t:e.top-R.top,b:e.bottom-R.top,cx:(e.left+e.right)/2-R.left,cy:(e.top+e.bottom)/2-R.top}};
 const seq=[['problems','pdecks'],...ORDER.slice(0,-1).map((g,i)=>[g,ORDER[i+1]])];let d='',dots='';
 for(const[a,b]of seq){const A=r(a),B=r(b);let p,q;
  if(B.t>=A.b-2&&Math.abs(B.cx-A.cx)<(A.r-A.l)/2){p=[A.cx,A.b];q=[B.cx,B.t];const k=(q[1]-p[1])/2;d+=`M${p[0]},${p[1]}C${p[0]},${p[1]+k} ${q[0]},${q[1]-k} ${q[0]},${q[1]}`}
  else if(B.l>=A.r-2){p=[A.r,Math.min(A.cy,A.t+24)];q=[B.l,Math.min(B.cy,B.t+24)];const k=(q[0]-p[0])/2;d+=`M${p[0]},${p[1]}C${p[0]+k},${p[1]} ${q[0]-k},${q[1]} ${q[0]},${q[1]}`}
  else if(B.r<=A.l+2){p=[A.l,Math.min(A.cy,A.t+24)];q=[B.r,Math.min(B.cy,B.t+24)];const k=(p[0]-q[0])/2;d+=`M${p[0]},${p[1]}C${p[0]-k},${p[1]} ${q[0]+k},${q[1]} ${q[0]},${q[1]}`}
  else{p=[A.cx,A.b];q=[B.cx,B.t];const k=Math.abs(q[1]-p[1])/2;d+=`M${p[0]},${p[1]}C${p[0]},${p[1]+k} ${q[0]},${q[1]-k} ${q[0]},${q[1]}`}
  dots+=`<circle cx="${p[0]}" cy="${p[1]}" r="3"/><circle cx="${q[0]}" cy="${q[1]}" r="3"/>`}
 svg.innerHTML=`<path d="${d}" fill="none" stroke="var(--wire)" stroke-width="1.6"/><g fill="var(--wire)">${dots}</g>`}
function draw(){const rec=L.filter(x=>x.ts&&!PINS.includes(x.u)).sort((a,b)=>b.ts-a.ts).slice(0,3);
 $('w').className='w v'+V;
 $('w').innerHTML=`<div class="top"><input id="q" type="search" placeholder="Search" aria-label="Search"><div class="res" id="res" hidden></div></div>
 <div class="row">${PINS.slice(0,3).map(pinT).join('')}${Array(Math.max(0,3-PINS.length)).fill('<div class="tl add">+</div>').join('')}${rec.map(recT).join('')}${infT('al','Alerts',AL)}${infT('nw','News',NW)}${infT('vs','Visits',VIS||[['—','visits'],['—','people']])}</div>
 <div class="map" id="map"><svg class="wires" id="wires"></svg>${layout()}</div>`;
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{$(b.dataset.m).hidden=false;b.remove();wires()});
 document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();if(!PINS.includes(b.dataset.pin)){PINS=[b.dataset.pin,...PINS].slice(0,3);savePins();draw()}});
 document.querySelectorAll('[data-un]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();PINS=PINS.filter(u=>u!==b.dataset.un);savePins();draw()});
 $('q').oninput=()=>{const q=$('q').value.trim().toLowerCase(),r=$('res');if(!q){r.hidden=true;return}r.innerHTML=L.filter(x=>x.t.toLowerCase().includes(q)).slice(0,12).map(it).join('')||'<div class="it"><b>—</b></div>';r.hidden=false};
 requestAnimationFrame(wires)}
draw();addEventListener('resize',wires);document.fonts&&document.fonts.ready.then(wires);
fetch('/decks/visits/data.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j){VIS=[[j.visits7,'visits'],[j.people7,'people']];draw()}}).catch(()=>{});
</script></body></html>

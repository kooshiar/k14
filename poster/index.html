  const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,W,H);
  const sc=Math.min(W,H)/(2*o.R+1.2)*.98,ct=Math.cos(o.th),sn=Math.sin(o.th),cp=Math.cos(o.ph),sp=Math.sin(o.ph);
  const P=o.m.X.map(([a,b,c])=>{const x1=a*ct+c*sn,z1=-a*sn+c*ct;return[W/2+x1*sc,H/2-(b*cp-z1*sp)*sc,b*sp+z1*cp];});
  const it=o.m.bonds.map(b=>({z:(P[b[0]][2]+P[b[1]][2])/2-.2,b})).concat(o.m.els.map((e,i)=>({z:P[i][2],i})));it.sort((a,b)=>a.z-b.z);
  for(const t of it){const f=.72+.28*((t.z/o.R)+1)/2;
    if(t.b){const[a,b]=t.b;x.globalAlpha=f;x.strokeStyle='#7C889C';x.lineWidth=Math.max(1,sc*.12);x.lineCap='round';x.beginPath();x.moveTo(P[a][0],P[a][1]);x.lineTo(P[b][0],P[b][1]);x.stroke();continue;}
    const e=o.m.els[t.i],[px,py]=P[t.i],r=(RAD[e]||.45)*sc,c=COL[e]||'#C9D1DE';x.globalAlpha=f;
    const gr=x.createRadialGradient(px-r*.35,py-r*.35,r*.1,px,py,r);gr.addColorStop(0,tone(c,.55));gr.addColorStop(.55,c);gr.addColorStop(1,tone(c,-.35));
    x.fillStyle=gr;x.beginPath();x.arc(px,py,r,0,7);x.fill();}
  x.globalAlpha=1;}

// central: designed molecular hand closing on its drug target (homepage film data, Int16 / 100 = angstrom, z up)
const hb=Uint8Array.from(atob(HB),c=>c.charCodeAt(0)), HD=new Int16Array(hb.buffer), hcv=document.getElementById('hand');
const isGuest=new Set(HAND.guest), nd=HAND.dyn.length;
const L=(HAND.frames-1)*nd*3;const hc=[0,1,2].map(j=>{let t=0;for(let a=0;a<nd;a++)t+=HD[L+3*a+j]/100;return t/nd});
let HR=0;for(let a=0;a<nd;a++)HR=Math.max(HR,Math.hypot(HD[L+3*a]/100-hc[0],HD[L+3*a+1]/100-hc[1],HD[L+3*a+2]/100-hc[2]));
const HO={th:.4};
function drawHand(t){const cv=hcv,d=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W)return;
  if(cv.width!==Math.round(W*d)){cv.width=Math.round(W*d);cv.height=Math.round(H*d);}
  const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,W,H);
  const f=Math.floor(t/1000*HAND.fps)%HAND.frames,o=f*nd*3,sc=Math.min(W,H)/(2*HR+1)*.78,ct=Math.cos(HO.th),sn=Math.sin(HO.th);
  const P=new Array(HAND.n);
  const cf=[0,1,2].map(k=>{let t=0;for(let j=0;j<nd;j++)t+=HD[o+3*j+k]/100;return t/nd});   // follow the pair: center on this frame
  HAND.dyn.forEach((a,j)=>{const X=HD[o+3*j]/100-cf[0],Y=HD[o+3*j+1]/100-cf[1],Z=HD[o+3*j+2]/100-cf[2];   // z up -> screen y
    const x1=X*ct+Y*sn,z1=-X*sn+Y*ct;P[a]=[W/2+x1*sc,H/2-Z*sc,z1];});
  const it=HAND.bonds.filter(([a,b])=>P[a]&&P[b]).map(b=>({z:(P[b[0]][2]+P[b[1]][2])/2-.2,b})).concat(HAND.dyn.map(a=>({z:P[a][2],i:a})));it.sort((a,b)=>a.z-b.z);
  for(const q of it){const fa=.75+.25*((q.z/HR)+1)/2;x.globalAlpha=Math.min(1,fa);
    if(q.b){const[a,b]=q.b;x.strokeStyle='#7C889C';x.lineWidth=Math.max(1,sc*.14);x.lineCap='round';x.beginPath();x.moveTo(P[a][0],P[a][1]);x.lineTo(P[b][0],P[b][1]);x.stroke();continue;}
    const g=isGuest.has(q.i),c=g?'#FF6A1A':'#3D7BFF',[px,py]=P[q.i],r=(HAND.radius[q.i]||.45)*sc*.95;
    const gr=x.createRadialGradient(px-r*.35,py-r*.35,r*.1,px,py,r);gr.addColorStop(0,tone(c,.55));gr.addColorStop(.55,c);gr.addColorStop(1,tone(c,-.35));
    x.fillStyle=gr;x.beginPath();x.arc(px,py,r,0,7);x.fill();}
  x.globalAlpha=1;}
let last=performance.now();
(function loop(t){const dt=t-last;last=t;items.forEach(o=>{if(!reduce)o.th+=dt*o.sp;draw(o)});if(!reduce)HO.th+=dt*.00012;drawHand(reduce?0:t);requestAnimationFrame(loop);})(last);
addEventListener('resize',()=>items.forEach(draw));

</script>
